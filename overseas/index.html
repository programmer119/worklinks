<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkLinks | 해외 조달</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#18243a;font:15px/1.6 system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:24px}header{background:#142840;color:white;padding:15px 24px}header div{max-width:1192px;margin:auto;display:flex;gap:20px;align-items:center}header a{color:#d8e6f6;text-decoration:none}header strong{font-size:21px}h1{font-size:28px;margin:12px 0 4px}h2{font-size:17px;margin:0 0 7px}p{margin:5px 0 14px}.muted{color:#58677b}.sources{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.panel,article,.source{background:white;border:1px solid #dbe2ec;border-radius:12px;padding:16px}.source strong{font-size:18px}.source .ok{color:#087645}.source .bad{color:#a43c1e}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}input,select,button{font:inherit;border:1px solid #bdc9d8;border-radius:7px;padding:9px 12px;background:white;color:#18243a}input{flex:1;min-width:180px}button{cursor:pointer}article{margin:10px 0}article h2{overflow-wrap:anywhere}a{color:#185ab5}article a{font-weight:650}.tag{display:inline-block;background:#e8eef7;border-radius:5px;padding:2px 8px;margin-right:6px;font-size:13px}.meta{display:flex;gap:16px;flex-wrap:wrap;color:#4f5f75;font-size:14px}.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin:20px 0}.notice{border-left:4px solid #d58a38;background:#fff8ed;padding:12px;margin:12px 0}.hidden{display:none}@media(max-width:620px){main{padding:14px}.sources{grid-template-columns:1fr}header div{flex-wrap:wrap}h1{font-size:23px}}
</style></head><body><header><div><strong>WorkLinks</strong><a href="/">🇰🇷 국내 조달</a><strong>🌐 해외 조달</strong></div></header><main><h1>해외 공공조달</h1><p class="muted">영국 · EU · 캐나다 | 소프트웨어·IT 후보 공고 통합 조회</p><div id="sources" class="sources"></div><div id="notice" class="notice" role="status">실제 수집 데이터를 불러오는 중입니다.</div><section class="panel"><div class="controls"><select id="country" aria-label="국가"><option value="">전체 국가</option></select><select id="stage" aria-label="공고 종류"><option value="">전체 공고 유형</option></select><input id="q" type="search" placeholder="원문 제목, 발주기관, 공고번호 검색" aria-label="공고 검색"><select id="sort" aria-label="정렬"><option value="new">최신 등록순</option><option value="deadline">마감 임박순</option></select></div><label><input id="active" type="checkbox"> 마감일이 남은 공고만</label><p id="count" aria-live="polite"></p><div id="list"></div><div class="pager"><button id="prev">이전</button><span id="page"></span><button id="next">다음</button></div></section><p class="muted">출처: <a href="https://www.find-tender.service.gov.uk/">UK Find a Tender (OGL)</a> · <a href="https://ted.europa.eu/">EU TED</a> · <a href="https://canadabuys.canada.ca/">CanadaBuys (Open Government Licence – Canada)</a>. SW 후보는 자동 분류이며 참가자격·해외 수행·경쟁률은 아직 판독하지 않았습니다. 원문에서 최종 확인하세요.</p></main><script>
"use strict";
const $=id=>document.getElementById(id), all=[];let page=1;
const names={GBR:"🇬🇧 영국",CAN:"🇨🇦 캐나다",AUT:"🇦🇹 오스트리아",BEL:"🇧🇪 벨기에",BGR:"🇧🇬 불가리아",HRV:"🇭🇷 크로아티아",CYP:"🇨🇾 키프로스",CZE:"🇨🇿 체코",DNK:"🇩🇰 덴마크",EST:"🇪🇪 에스토니아",FIN:"🇫🇮 핀란드",FRA:"🇫🇷 프랑스",DEU:"🇩🇪 독일",GRC:"🇬🇷 그리스",HUN:"🇭🇺 헝가리",IRL:"🇮🇪 아일랜드",ITA:"🇮🇹 이탈리아",LVA:"🇱🇻 라트비아",LTU:"🇱🇹 리투아니아",LUX:"🇱🇺 룩셈부르크",MLT:"🇲🇹 몰타",NLD:"🇳🇱 네덜란드",POL:"🇵🇱 폴란드",PRT:"🇵🇹 포르투갈",ROU:"🇷🇴 루마니아",SVK:"🇸🇰 슬로바키아",SVN:"🇸🇮 슬로베니아",ESP:"🇪🇸 스페인",SWE:"🇸🇪 스웨덴"};
const labels={uk:"영국 Find a Tender",eu:"EU TED",ca:"캐나다 CanadaBuys"}, aliases={uk:"GBR",ca:"CAN",ie:"IRL"};
const el=(tag,txt,cls)=>{let e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e};
const date=v=>{if(!v)return NaN;const s=String(v).trim();return Date.parse(/^\d{8}$/.test(s)?s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6):s)};
const fmt=v=>{let d=date(v);return Number.isFinite(d)?new Date(d).toLocaleDateString("ko-KR"):v||"미확인"};
function render(){let q=$("q").value.trim().toLowerCase(),c=$("country").value,s=$("stage").value;
let filtered=all.filter(r=>(!c||String(r.country).split(" | ").includes(c)||r.source===c)&&(!s||r.stage===s)&&(!q||[r.title,r.buyer,r.id].join(" ").toLowerCase().includes(q))&&(!$("active").checked||date(r.deadline)>=Date.now()));
filtered.sort((a,b)=>$("sort").value==="deadline"?(Number.isFinite(date(a.deadline))?date(a.deadline):Infinity)-(Number.isFinite(date(b.deadline))?date(b.deadline):Infinity):(date(b.published)||0)-(date(a.published)||0));
let max=Math.max(1,Math.ceil(filtered.length/30));page=Math.min(page,max);$("count").textContent="검색 결과 "+filtered.length.toLocaleString()+"건 / 전체 "+all.length.toLocaleString()+"건";$("list").replaceChildren();
for(const r of filtered.slice((page-1)*30,page*30)){let a=el("article"), tags=el("div");tags.append(el("span",String(r.country).split(" | ").map(c=>names[c]||c||"국가 미확인").join(" · "),"tag"),el("span",r.stage||"유형 미확인","tag"));a.append(tags,el("h2",r.title),el("div",r.buyer||"발주기관 미확인","muted"));let m=el("div",null,"meta");m.append(el("span","등록 "+fmt(r.published)),el("span","마감 "+fmt(r.deadline)),el("span","예산 "+(r.amount!=null?Number(r.amount).toLocaleString()+" "+(r.currency||""):"미확인")));a.append(m);try{let u=new URL(r.url);if(u.protocol==="https:"){let link=el("a","원문 공고");link.href=u.href;link.target="_blank";link.rel="noopener noreferrer";a.append(link)}}catch{}$("list").append(a)}
if(!filtered.length)$("list").append(el("p","조건에 해당하는 공고가 없습니다.","muted"));$("page").textContent=page+" / "+max;$("prev").disabled=page===1;$("next").disabled=page===max}
for(const id of ["country","stage","q","sort","active"])$(id).addEventListener(id==="q"?"input":"change",()=>{page=1;if(id==="country"){let u=new URL(location.href);if($(id).value)u.searchParams.set("country",$(id).value.toLowerCase());else u.searchParams.delete("country");history.replaceState(null,"",u)}render()});
$("prev").onclick=()=>{page--;render()};$("next").onclick=()=>{page++;render()};
for(const [v,t] of Object.entries(names))$("country").append(new Option(t,v));$("country").append(new Option("🇪🇺 EU 전체","eu"));const initial=new URLSearchParams(location.search).get("country");if(initial)$("country").value=aliases[initial]||(initial==="eu"?"eu":initial.toUpperCase());
async function load(){try{const resp=await fetch("https://raw.githubusercontent.com/programmer119/worklinks/overseas-data/overseas/notices.json",{cache:"no-store"});if(!resp.ok)throw Error("HTTP "+resp.status);const d=await resp.json();if(!Array.isArray(d.notices))throw Error("데이터 형식 오류");all.push(...d.notices);for(const key of Object.keys(labels)){let st=d.sources?.[key],box=el("div",null,"source");box.append(el("strong",labels[key]),el("div",all.filter(r=>r.source===key).length.toLocaleString()+"건"),el("div",!st?"미수집":st.error?"수집 오류 · 이전 결과 유지":"수집 성공",st&&!st.error?"ok":"bad"),el("div","최근 성공: "+(st?.success?new Date(st.success).toLocaleString("ko-KR"):"없음"),"muted"));$("sources").append(box)}for(const s of [...new Set(all.map(r=>r.stage).filter(Boolean))].sort())$("stage").append(new Option(s,s));$("notice").textContent="갱신: "+new Date(d.generatedAt).toLocaleString("ko-KR")+" · 영국/EU 최근 "+d.days+"일, 캐나다 현재 진행 공고";render()}catch(e){$("notice").textContent="아직 해외 수집 결과가 게시되지 않았거나 연결에 실패했습니다. ("+e.message+")";render()}}load();
</script></body></html>
