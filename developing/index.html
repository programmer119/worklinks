*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#18243a;font:15px/1.6 system-ui,sans-serif}header{background:#142840;color:white;padding:15px 24px}header div{max-width:1192px;margin:auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap}header a{color:#d8e6f6;text-decoration:none}header strong{font-size:21px}main{max-width:1240px;margin:auto;padding:24px}h1{font-size:28px;margin:8px 0}h2{font-size:17px;margin:4px 0}p{margin:5px 0 14px}.muted{color:#58677b}.sources{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}.source,.panel,article{background:white;border:1px solid #dbe2ec;border-radius:12px;padding:16px;overflow-wrap:anywhere}.source strong{display:block;font-size:17px}.source b{font-size:24px}.bad{color:#a43c1e}.ok{color:#087645}.controls{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;background:white;color:#18243a;border:1px solid #bdc9d8;border-radius:7px;padding:9px 12px}input{flex:1;min-width:170px}button{cursor:pointer}a{color:#185ab5}article{margin:10px 0}article h2{color:#174f8b}.tag{display:inline-block;background:#e8eef7;border-radius:5px;padding:2px 8px;margin-right:6px;font-size:13px}.pager{display:flex;justify-content:center;gap:12px;align-items:center}.notice{border-left:4px solid #d58a38;background:#fff8ed;padding:12px;margin:12px 0}summary{cursor:pointer}details p{white-space:pre-wrap}@media(max-width:620px){main{padding:14px}.sources{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:23px}}
</style></head><body><header><div><strong>WorkLinks</strong><a href="/">국내 조달</a><a href="/overseas/">해외 공공조달</a><strong>개발도상국 공공조달</strong></div></header><main><h1>개발도상국 공공조달</h1><p class="muted">국제기구·다자개발은행 | 사업 수행국 기준 · 저소득·중저소득·중상소득 국가 · 기존 한국/영국/EU/캐나다 제외</p><div id="sources" class="sources"></div><div class="notice" id="status" role="status">공식 수집 결과를 불러오는 중입니다.</div><section class="panel"><div class="controls"><select id="source" aria-label="수집처"><option value="">전체 수집처</option></select><select id="country" aria-label="수행국"><option value="">전체 수행국</option></select><input id="q" type="search" placeholder="제목 · 국가 · 발주처 · 공고번호" aria-label="공고 검색"><button id="reload">새로고침</button></div><p id="count"></p><div id="list"></div><div class="pager"><button id="prev">이전</button><span id="page"></span><button id="next">다음</button></div></section><p class="muted">SW 후보 자동 분류입니다. 참가자격, 세부 수행국 및 원문 요구사항은 별도 확인이 필요합니다. 부분 수집 및 장애는 출처별로 표시합니다.</p></main><script>
"use strict";const $=id=>document.getElementById(id),labels={wb:"World Bank",ungm:"UNGM",adb:"ADB",afdb:"AfDB",ebrd:"EBRD",idb:"IDB",aiib:"AIIB",edcf:"EDCF"},el=(t,s,c)=>{const e=document.createElement(t);if(s!=null)e.textContent=s;if(c)e.className=c;return e};let data=[],page=1;
const countryNames={MDA:"몰도바",TUV:"투발루",VNM:"베트남",KEN:"케냐",EGY:"이집트",IND:"인도",KHM:"캄보디아",UZB:"우즈베키스탄",KGZ:"키르기스스탄",PAK:"파키스탄",BGD:"방글라데시"};const name=c=>countryNames[c]||c;
for(const [k,v] of Object.entries(labels))$("source").append(new Option(v,k));
function render(){const q=$("q").value.toLowerCase().trim(),s=$("source").value,c=$("country").value;const list=data.filter(r=>(!s||r.source===s)&&(!c||r.countries.includes(c))&&(!q||[r.title,r.id,r.reference,r.buyer,r.description,...r.countries,...r.countries.map(name)].join(" ").toLowerCase().includes(q))).sort((a,b)=>String(b.published).localeCompare(String(a.published)));const max=Math.max(1,Math.ceil(list.length/30));page=Math.min(max,page);$("count").textContent="검색 결과 "+list.length.toLocaleString()+"건 / 전체 "+data.length.toLocaleString()+"건";$("list").replaceChildren();for(const r of list.slice((page-1)*30,page*30)){const a=el("article");a.append(el("span",labels[r.source]||r.source,"tag"),el("span",r.countries.map(name).join(" · "),"tag"),el("h2",r.title),el("p","공고번호 "+(r.reference||r.id)+" · "+(r.buyer||"발주기관 미확인")+" · 등록 "+(r.published||"미확인")+" · 마감 "+(r.deadline||"미확인"),"muted"));const link=el("a","공식 원문");try{const u=new URL(r.url);if(u.protocol==="https:"){link.href=u.href;link.target="_blank";link.rel="noopener noreferrer";a.append(link)}}catch{}if(r.description){const d=el("details");d.append(el("summary","수집 원문"),el("p",r.description));a.append(d)}$("list").append(a)}if(!list.length)$("list").append(el("p","표시할 수집 공고가 없습니다.","muted"));$("page").textContent=page+" / "+max;$("prev").disabled=page===1;$("next").disabled=page===max}
async function load(){try{const r=await fetch("https://raw.githubusercontent.com/programmer119/worklinks/developing-data/developing/notices.json?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const d=await r.json();if(!Array.isArray(d.notices))throw Error("데이터 형식 오류");data=d.notices;const selected=$("country").value;$("country").replaceChildren(new Option("전체 수행국",""));for(const c of [...new Set(data.flatMap(r=>r.countries))].sort())$("country").append(new Option(name(c),c));$("country").value=selected;$("sources").replaceChildren();for(const [k,v] of Object.entries(labels)){const st=d.sources[k]||{},a=el("div",null,"source");a.append(el("strong",v),el("b",String(st.count??"—")),el("div",st.state==="ok"?"수집 완료":st.state==="error"?"수집 실패":st.state?"부분 수집":"미수집",st.state==="ok"?"ok":"bad"),el("small",st.error||st.state||""));$("sources").append(a)}$("status").textContent="최근 수집 시각: "+new Date(d.generatedAt).toLocaleString("ko-KR")+" · 부분 수집과 실패는 전체 수집 성공으로 간주하지 않습니다.";render()}catch(e){$("status").textContent="수집 결과를 확인하지 못했습니다: "+e.message;render()}}
for(const id of ["source","country","q"])$(id).addEventListener(id==="q"?"input":"change",()=>{page=1;render()});$("prev").onclick=()=>{page--;render()};$("next").onclick=()=>{page++;render()};$("reload").onclick=load;load();
</script></body></html>
