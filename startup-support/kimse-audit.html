<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>낌새 공식 공고 검증현황 | WorkLinks</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#182534;background:#f6f8fa}
*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:22px 18px 54px}
a{color:#145c9e}h1{font-size:25px;margin:0 0 8px}h2{font-size:18px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
nav{display:flex;gap:15px;flex-wrap:wrap;font-size:14px}p{line-height:1.65}
.sub{color:#5b6878;font-size:13px}section{margin:20px 0}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat,.panel{background:white;border:1px solid #dce3ec;border-radius:12px;padding:16px}
.stat strong{font-size:27px;display:block;margin-top:4px}.stat span{color:#627284;font-size:12px}
.controls{display:flex;gap:10px;flex-wrap:wrap;padding:15px;background:white;border:1px solid #dce3ec;border-radius:12px}
.controls input{flex:1;min-width:180px}select,input{font:inherit;font-size:14px;border:1px solid #bac8d9;border-radius:7px;padding:10px;background:white}
.notice{border-top:1px solid #e3e8ef;padding:14px 0}.notice:first-of-type{border-top:none}
.notice h3{font-size:15px;margin:7px 0}.notice p{font-size:13px;color:#536579;margin:5px 0}
.tag{font-size:11px;font-weight:800;padding:4px 7px;border-radius:5px;background:#edf2f7;color:#3f5971;display:inline-block;margin:0 5px 2px 0}
.tag.alert{background:#fff0d8;color:#855a14}.tag.good{background:#e1f3e7;color:#11683e}
.small{font-size:12px;color:#637184}.warn{border-left:4px solid #c58a25;background:#fff8e9;padding:13px 16px;border-radius:6px}
.error{color:#a23c30}.page{padding:13px 0;border-top:1px solid #e5e9ef;word-break:break-all}
button{cursor:pointer;border:1px solid #b4c7da;background:#edf5ff;border-radius:8px;padding:9px 13px;font-weight:750}
@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}main{padding:15px 12px}.stat strong{font-size:24px}}
</style>
</head>
<body><main>
<header><div><h1>낌새 공식 공고 정밀검사</h1><p class="sub">공식 기관 목록·개별 공고·신청 마감일·신청자격 근거를 분리해 검증합니다.</p></div>
<nav><a href="./?view=support">WorkLinks 홈</a><a href="./investment.html?review=kimse">검증대기 공고 목록</a></nav></header>
<p class="warn">공식 공고를 발견했다는 사실만으로 현재 접수 중이거나 낌새의 지원자격이 확인된 것은 아닙니다. 신청 전 기관 원문과 첨부 공고문 확인이 필요합니다.</p>
<p id="updated" class="small">정밀검사 결과를 확인 중입니다.</p>
<section class="grid">
<div class="stat"><span>실제 확인한 목록 페이지</span><strong id="pages">—</strong></div>
<div class="stat"><span>미확인·실패 목록 페이지</span><strong id="missing">—</strong></div>
<div class="stat"><span>상세검사 완료 시도</span><strong id="examined">—</strong></div>
<div class="stat"><span>미검사 상세 공고</span><strong id="unexamined">—</strong></div>
</section>
<section><h2>개별 공고 검증 결과</h2>
<div class="controls"><input id="query" type="search" placeholder="공고명 또는 기관 검색" aria-label="공고 검색">
<select id="status" aria-label="검증 상태"><option value="">전체 상태</option><option value="unknown_deadline">마감일 불명</option>
<option value="access_failed">상세 접속 실패</option><option value="deadline_verified_eligibility_pending">마감일 확인·자격 미확인</option>
<option value="expired_confirmed">마감 확인</option><option value="historical_unverified">과거 공고 추정·미확인</option>
<option value="invalid_official_link">공식 링크 검증 실패</option></select>
<select id="fit" aria-label="낌새 관련성"><option value="">관련성 전체</option><option value="높음">높음</option><option value="검토">검토</option><option value="기타">기타</option></select></div>
<p id="found" class="small"></p><div id="results" class="panel">불러오는 중입니다.</div><p id="more" class="small"></p></section>
<section><h2>기관별 페이지 접근 결과</h2><div id="sources" class="panel">불러오는 중입니다.</div></section>
</main>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=x=>{try{const u=new URL(x);return u.protocol==='https:'?u.href:'#'}catch{return '#'}};
let data=null;
const format=x=>x?new Date(x).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}):'미확인';
const num=x=>String(Number(x||0)).replace(/\B(?=(\d{3})+(?!\d))/g,',');
function draw(){
if(!data)return;
const q=$('query').value.trim().toLocaleLowerCase(),st=$('status').value,fit=$('fit').value;
const all=data.results||[];
const filtered=all.filter(x=>(!st||x.status===st)&&(!fit||x.kimseFit===fit)&&
 (!q||[x.title,x.source,x.status].join(' ').toLocaleLowerCase().includes(q)));
$('found').textContent=filtered.length+'건 표시 · 총 '+all.length+'건. 여기에는 신청 가능한 것으로 확정되지 않은 공고가 포함됩니다.';
const labels={access_failed:'상세 접속 실패',unknown_deadline:'마감일 불명',
 historical_unverified:'과거 공고 추정·미확인',deadline_verified_eligibility_pending:'마감일 확인·자격 미확인',
 expired_confirmed:'마감 확인',invalid_official_link:'공식 링크 검증 실패',audit_error:'검사 오류',invalid_deadline:'마감일 형식 오류'};
$('results').innerHTML=filtered.slice(0,140).map(x=>
 '<div class="notice"><span class="tag '+(x.status==='deadline_verified_eligibility_pending'?'good':'alert')+'">'+
 esc(labels[x.status]||x.status)+'</span><span class="tag">낌새 관련성 '+esc(x.kimseFit||'미판정')+
 '</span><h3><a target="_blank" rel="noopener noreferrer" href="'+esc(url(x.url))+'">'+esc(x.title)+'</a></h3>'+
 '<p>'+esc(x.source)+' · 신청 마감일 '+esc(x.applicationDeadline||'미확인')+
 ' · 신청자격 '+esc(x.eligibility||'미확인')+'</p>'+
 (x.eligibilityEvidence?'<p>판정 근거: '+esc(x.eligibilityEvidence)+'</p>':'')+
 (x.detailError?'<p class="error">접근 문제: '+esc(x.detailError)+'</p>':'')+
 (x.attachmentLinks?.length?'<p>공식 첨부 링크 '+x.attachmentLinks.length+'개 (추가 검증 필요)</p>':'')+
 '<p class="small">목록 확인 근거: '+esc(x.evidence||'미확인')+'</p></div>').join('')||
 '<p class="small">조건에 맞는 공고가 없습니다.</p>';
$('more').textContent=filtered.length>140?'화면에는 앞의 140건만 표시됩니다. 검색을 좁혀 확인하세요.':'';
}
function display(d){
data=d;
const s=d.summary||{};
$('updated').textContent='최종 정밀검사 기록: '+format(d.generatedAt)+' · 출처 '+num(s.sources)+'곳. 완전성 검증과 접수자격 판정은 별개입니다.';
$('pages').textContent=num(s.pagesActuallyRead);
$('missing').textContent=num(Number(s.pageErrors||0)+Number(s.pagesPending||0));
$('examined').textContent=num(s.detailExamined);
$('unexamined').textContent=num(s.detailUnexamined);
$('sources').innerHTML=(d.sources||[]).map(x=>
 '<div class="page"><strong>'+esc(x.source)+'</strong><p class="small">실제 탐색 '+num(x.visited)+'페이지 · 미탐색 '+num(x.pendingPages?.length)+'페이지 · 실패 '+num(x.failedPages?.length)+'페이지</p>'+
 (x.failedPages?.length?'<p class="error">'+esc(x.failedPages.slice(0,3).map(y=>y.error).join(' / '))+'</p>':'')+'</div>').join('');
draw();
}
for(const id of ['query','status','fit'])$(id).addEventListener(id==='query'?'input':'change',draw);
fetch('./kimse-deep-audit.json?cache='+Date.now(),{cache:'no-store'})
 .then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()})
 .then(display)
 .catch(err=>{$('updated').textContent='정밀검사 결과를 아직 확인할 수 없습니다: '+err.message;
  $('results').textContent='완료된 공식 검사 기록이 없습니다. 이전 WorkLinks 공고 검증대기 목록을 이용하세요.';
  $('sources').textContent='데이터 없음';});
})();
</script>
</body></html>
