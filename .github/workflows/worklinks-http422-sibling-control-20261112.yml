name: WorkLinks G2B same-RFP sibling control and HWP PDF alternative
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/worklinks-http422-sibling-control-20261112.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify neighboring E-order URLs and PDF alternative on the same service
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip -q install pypdf
          python3 - <<'PY'
          import io,hashlib,json,urllib.request,urllib.error
          from pypdf import PdfReader
          files=[
           ('namyangju_same_rfp_28','https://www.g2b.go.kr/pn/pnp/pnpe/UntyAtchFile/downloadRfpFile.do?rfpNo=R26DH00060250&rfpOrd=000&rfpUntyAtchFileNo=28'),
           ('ulsan_same_rfp_36','https://www.g2b.go.kr/pn/pnp/pnpe/UntyAtchFile/downloadRfpFile.do?rfpNo=R26DH00061447&rfpOrd=000&rfpUntyAtchFileNo=36'),
           ('blue_sea_same_rfp_106','https://www.g2b.go.kr/pn/pnp/pnpe/UntyAtchFile/downloadRfpFile.do?rfpNo=R26DH00062439&rfpOrd=000&rfpUntyAtchFileNo=106'),
           ('bid_notice_hwp_pdf_sibling','https://www.g2b.go.kr/pn/pnp/pnpe/UntyAtchFile/downloadFile.do?bidPbancNo=R26BK01811303&bidPbancOrd=000&fileType=&fileSeq=2&prcmBsneSeCd=03')
          ]
          for name,url in files:
             record={'name':name,'url':url}
             try:
               req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.g2b.go.kr/'})
               with urllib.request.urlopen(req,timeout=30) as r:
                   data=r.read(12000001)
                   record.update(httpStatus=r.status,bytesReceived=len(data),magic=data[:8].hex(),contentType=r.headers.get('Content-Type'))
                   if len(data)>12000000:raise ValueError('large_file')
               if name=='bid_notice_hwp_pdf_sibling' and data.startswith(b'%PDF-'):
                   pdf=PdfReader(io.BytesIO(data))
                   texts=[(p.extract_text() or '') for p in pdf.pages]
                   record.update(pdfPages=len(texts),textChars=sum(len(x.strip()) for x in texts),
                                 readablePages=sum(bool(x.strip()) for x in texts),
                                 firstTextSnippet=next((x.strip()[:170] for x in texts if x.strip()),''))
             except urllib.error.HTTPError as e:
               record.update(httpStatus=e.code,body=e.read(600).decode('utf-8','replace')[:400])
             except Exception as e:
               record.update(error=type(e).__name__,detail=str(e)[:230])
             print('WORKLINKS_SIBLING_CONTROL '+json.dumps(record,ensure_ascii=False),flush=True)
          PY
