name: WorkLinks SMPP public detail probe (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/worklinks-smpp-public-detail-probe.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect official public direct production listing only
        shell: bash
        run: |
          python3 - <<'PY'
          import re, html, json, urllib.request, urllib.parse, urllib.error
          BASE='https://www.smpp.go.kr/cst/smppInf/selectDpCnfrmnListVw.do'
          QUERIES=[
           ('real_business',{'searchBsnmNo':'1308185973','vCheck':'Y'}),
           ('unknown_business',{'searchBsnmNo':'0000000000','vCheck':'Y'}),
           ('real_product',{'searchBsnmNo':'1308185973','searchPdctCd':'8111189901','vCheck':'Y'}),
           ('fake_product',{'searchBsnmNo':'1308185973','searchPdctCd':'0000000000','vCheck':'Y'}),
           ('actual_detail_code',{'searchBsnmNo':'1308185973','detailPrdnmNo':'8111189901','vCheck':'Y'}),
           ('false_detail_code',{'searchBsnmNo':'1308185973','detailPrdnmNo':'0000000000','vCheck':'Y'}),
           ('other_detail_code',{'searchBsnmNo':'1308185973','detailPrdnmNo':'8111159901','vCheck':'Y'}),
          ]
          for label,query in QUERIES:
            url=BASE+'?'+urllib.parse.urlencode(query)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ko-KR,ko;q=0.9','Referer':'https://www.smpp.go.kr/'})
              with urllib.request.urlopen(req,timeout=30) as response:
                data=response.read(1600000); status=response.status
              body=data.decode('utf-8','replace')
              hits=list(re.finditer('창컴정보통신',body))
              count=list(re.finditer(r'전체\s*<[^>]*>\s*([0-9,]+)',body))
              print('SMPP_LIST',json.dumps({'probe':label,'status':status,'bytes':len(data),'companyMentions':len(hits),
               'totalCountHTML':count[0].group(1) if count else None},ensure_ascii=False),flush=True)
              if label in ('actual_detail_code','false_detail_code','other_detail_code'):
                field=re.search(r'<input[^>]+name=["\\']detailPrdnmNo["\\'][^>]*>',body,re.I)
                print('SMPP_DETAIL_FILTER_ECHO',label,field.group(0)[:350] if field else 'not_found',flush=True)
              if label!='real_business' or not hits: continue
              for idx,hit in enumerate(hits[:3]):
                excerpt=body[max(0,hit.start()-1100):hit.end()+700]
                excerpt=re.sub(r'\s+',' ',excerpt)
                print('SMPP_COMPANY_HTML_NEAR_ROW',idx,excerpt[:1850],flush=True)
              forms=re.findall(r'<form\b[^>]*>',body,re.I)
              print('SMPP_FORMS',json.dumps(forms[:9],ensure_ascii=False),flush=True)
              hidden=re.findall(r'<input\b[^>]*(?:type=["\']hidden["\']|name=["\'][^"\']*(?:search|prdc|pdct|dtil|bsnm|biz|comp)[^"\']*["\'])[^>]*>',body,re.I)
              print('SMPP_FILTER_INPUTS',json.dumps(hidden[:45],ensure_ascii=False),flush=True)
              js=re.findall(r'<script\b[^>]*src=["\']([^"\']+)["\']',body,re.I)
              print('SMPP_SCRIPT_URLS',json.dumps(js[-35:],ensure_ascii=False),flush=True)
              for term in ['selectDpCnfrmn','fnDetail','fnDtl','fnView','fnSearch','fnGo','selectDp','prdc','pdct','fncDetail']:
                matches=list(re.finditer(re.escape(term),body,re.I))
                print('SMPP_MARKER',term,len(matches),[' '.join(body[max(0,m.start()-120):m.end()+190].split())[:320] for m in matches[:3]],flush=True)
            except Exception as exc:
              print('SMPP_LIST_ERROR',label,type(exc).__name__,str(exc)[:240],flush=True)
          print('SMPP_PROBE_DONE=READ_ONLY_NO_CHANGES')
          PY