name: WorkLinks prebid stages and award filters
on:
  push:
    branches: [main]
    paths:
      - 'scripts/g2b_prebid_collector.py'
      - 'server/g2b-proxy.py'
      - 'server/deploy-g2b-prebid-only.sh'
      - 'startup-support/changcom-prebid.js'
      - 'startup-support/index.html'
      - 'tests/test_g2b_prebid_collector.py'
      - 'tests/test_changcom_prebid_filters.cjs'
      - 'tests/test_worklinks_prebid_source_ui.cjs'
      - 'tests/test_worklinks_prebid_real_file_names.py'
      - 'tests/test_worklinks_transient_api_recovery.cjs'
      - 'tests/test_worklinks_social_share.cjs'
      - 'startup-support/share/**'
      - '.github/workflows/worklinks-prebid-stage-and-award-filter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/g2b_prebid_collector.py'
      - 'server/g2b-proxy.py'
      - 'startup-support/changcom-prebid.js'
      - 'startup-support/index.html'
      - 'tests/test_g2b_prebid_collector.py'
      - 'tests/test_changcom_prebid_filters.cjs'
      - 'tests/test_worklinks_prebid_source_ui.cjs'
      - 'tests/test_worklinks_prebid_real_file_names.py'
      - 'tests/test_worklinks_transient_api_recovery.cjs'
      - 'tests/test_worklinks_social_share.cjs'
      - 'startup-support/share/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify isolated collector and read-only API without API credentials
        run: |
          set -Eeuo pipefail
          python -m py_compile scripts/g2b_prebid_collector.py server/g2b-proxy.py
          python tests/test_g2b_prebid_collector.py
          python tests/test_worklinks_prebid_real_file_names.py
          node --check startup-support/changcom-prebid.js
          node tests/test_changcom_prebid_filters.cjs
          node tests/test_worklinks_prebid_source_ui.cjs
          node tests/test_worklinks_transient_api_recovery.cjs
          node tests/test_worklinks_social_share.cjs
          node tests/test_worklinks_exact_bid_link.cjs
          node tests/test_worklinks_auth_deeplink.cjs
          bash -n server/deploy-g2b-prebid-only.sh
          echo WORKLINKS_PREBID_AND_PRICE_SW_FILTERS_PASS
      - name: Real Chrome desktop/mobile regressions using current main handlers
        run: |
          set -Eeuo pipefail
          npm install --prefix "$RUNNER_TEMP/worklinks-stage-browser" --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          NODE_PATH="$RUNNER_TEMP/worklinks-stage-browser/node_modules" node tests/test_worklinks_stage_browser.cjs
          NODE_PATH="$RUNNER_TEMP/worklinks-stage-browser/node_modules" node tests/test_worklinks_exact_bid_browser.cjs
          echo WORKLINK_FINAL_STAGE_BROWSER_PASS
      - name: Keep actual desktop/mobile dialog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worklinks-stage-final-dialogs
          path: artifacts/*.png
          if-no-files-found: ignore
