name: Verify and archive exact Yongin official source workbook
on:
  push:
    branches: [main]
    paths: [.github/workflows/archive-yongin-official-original-20261113.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify official G2B attachment and print original workbook layout
        shell: bash
        run: |
          python3 -m pip -q install openpyxl
          python3 - <<'PY'
          import urllib.request,hashlib,pathlib,io,json
          from openpyxl import load_workbook
          url='https://www.g2b.go.kr/pn/pnp/pnpe/UntyAtchFile/downloadFile.do?bidPbancNo=R26BK01807134&bidPbancOrd=000&fileType=&fileSeq=3&prcmBsneSeCd=03'
          request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          raw=urllib.request.urlopen(request,timeout=35).read()
          digest=hashlib.sha256(raw).hexdigest()
          assert digest=='7e93a5acc6d1d406afd95ebfcbd73a1df92c3733c2653748c931dd8eea1529d2',digest
          original=load_workbook(io.BytesIO(raw),data_only=False)
          print('ORIGINAL_SHEETS',original.sheetnames)
          for sh in original:
            print('ORIGINAL_SHEET',sh.title,'dimensions',sh.max_row,sh.max_column,'merged',
              [str(x) for x in list(sh.merged_cells.ranges)[:35]])
            for row in sh.iter_rows():
              cells=[f'{c.coordinate}={str(c.value)[:75]}' for c in row if c.value is not None]
              if sh.title=='홈페이지' and cells: print('ORIGINAL_HOMEPAGE_ROW',row[0].row,' | '.join(cells[:18])[:1200])
              if cells and (any('투입' in x or '직무' in x or '상주' in x or '홈페이지' in x for x in cells) or len(cells)>6):
                print('ORIGINAL_ROW',sh.title,' | '.join(cells[:18])[:1100])
          path=pathlib.Path('startup-support/audits/originals/R26BK01807134_공내역서_원본.xlsx')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_bytes(raw)
          print('ORIGINAL_FILE_SHA256',digest,'SIZE',len(raw),'PATH',path)
          PY
      - name: Commit original unchanged XLSX bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          path='startup-support/audits/originals/R26BK01807134_공내역서_원본.xlsx'
          git add -- "$path"
          if git diff --cached --quiet;then echo ORIGINAL_ARCHIVE_ALREADY_PRESENT=PASS; exit 0;fi
          git commit -m 'docs: archive SHA-256 verified official Yongin original workbook'
          for retry in 1 2 3;do
            if git push origin HEAD:main;then echo ORIGINAL_XLSX_ARCHIVED=PASS;exit 0;fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
