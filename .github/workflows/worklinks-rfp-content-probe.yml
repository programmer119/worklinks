name: WorkLinks public RFP attachment live verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/worklinks-rfp-content-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify specific official bid attachment API and download (read-only)
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,urllib.parse
          no='R26BK01797629'
          url='https://api-suaveforge.suaveforge.com:18458/api/g2b/bid-evidence?bidNo='+no+'&order=000'
          req=urllib.request.Request(url,headers={'User-Agent':'WorkLinks-RFP-Live-Probe/1.0','Accept':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=28) as response:
                  status=response.status
                  data=json.load(response)
          except urllib.error.HTTPError as e:
              print('BID_EVIDENCE_HTTP_FAILURE',e.code,flush=True)
              raise
          except Exception as e:
              print('BID_EVIDENCE_TRANSPORT_FAILURE',type(e).__name__,str(e)[:180],flush=True)
              raise
          e=data.get('attachments') or {}
          detail=data.get('noticeDocuments') or {}
          items=e.get('items') or []
          print('BID_EVIDENCE_RESULT',json.dumps({
              'notice':no,'http':status,'ok':data.get('ok'),
              'attachmentOk':e.get('ok'),'attachmentComplete':e.get('complete'),
              'eorderCount':e.get('eorderCount'),
              'noticeDetailOk':detail.get('ok'),
              'noticeDetailComplete':detail.get('complete'),
              'noticeDetailCount':detail.get('noticeRows'),
              'fileCount':len(items),
              'attachmentError':str(e.get('error') or '')[:180],
              'noticeDetailError':str(detail.get('error') or '')[:180],
              'names':[str(i.get('name') or '')[:70] for i in items[:12]]
          },ensure_ascii=False),flush=True)
          selected=None
          for item in items:
              u=urllib.parse.urlsplit(str(item.get('url') or ''))
              if u.scheme=='https' and u.hostname=='www.g2b.go.kr' and u.port in (None,443) and u.path.startswith('/pn/pnp/pnpe/UntyAtchFile/'):
                  selected=item
                  break
          if not selected:
              print('ATTACHMENT_FILE_DOWNLOAD=UNAVAILABLE','API metadata may be unavailable, empty or lack direct official links',flush=True)
              if not (e.get('ok') and detail.get('ok')):
                  raise SystemExit('OFFICIAL_ATTACHMENT_API_NOT_BOTH_WORKING')
              raise SystemExit('NO_DIRECT_OFFICIAL_ATTACHMENT_URL')
          req=urllib.request.Request(selected['url'],headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.g2b.go.kr/'})
          try:
              with urllib.request.urlopen(req,timeout=40) as response:
                  raw=response.read(12_000_001)
                  print('ATTACHMENT_DOWNLOAD',json.dumps({
                      'status':response.status,'fileName':str(selected.get('name') or '')[:100],
                      'size':len(raw),'contentType':str(response.headers.get('Content-Type') or '')[:80],
                      'magic':raw[:8].hex()
                  },ensure_ascii=False),flush=True)
          except urllib.error.HTTPError as ex:
              print('ATTACHMENT_DOWNLOAD_HTTP_FAILURE',ex.code,flush=True)
              raise
          if len(raw)>12_000_000:raise SystemExit('ATTACHMENT_FILE_TOO_BIG_FOR_PROBE')
          magic_ok=raw.startswith((b'%PDF-',b'PK\\x03\\x04',bytes.fromhex('D0CF11E0A1B11AE1')))
          if not magic_ok:raise SystemExit('FILE_NOT_PDF_OR_HWP_OR_ZIP_FORMAT')
          print('OFFICIAL_BID_ATTACHMENT_DOWNLOAD=PASS',flush=True)
          PY
