name: WorkLinks three real staffing RFP checks
on:
  pull_request:
    paths:
      - 'scripts/verify_three_live_staffing_sources.py'
      - 'scripts/staffing_facts.py'
      - 'scripts/refresh_worklinks_rfp.py'
      - 'scripts/backfill_worklinks_staffing_cached.py'
      - 'scripts/publish_worklinks_staffing_patch.py'
      - 'server/g2b-proxy.py'
      - 'startup-support/index.html'
      - 'tests/test_staffing_facts.py'
      - 'tests/test_rfp_staffing_roles.py'
      - 'tests/worklinks-staffing-facts-ui.cjs'
      - '.github/workflows/worklinks-three-real-staffing-20261113.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install real HWP PDF readers
        run: python3 -m pip install -q pyhwp pypdf Pillow
      - name: Verify separate staffing-fact semantics
        run: |
          python3 -m py_compile scripts/staffing_facts.py scripts/refresh_worklinks_rfp.py scripts/backfill_worklinks_staffing_cached.py scripts/publish_worklinks_staffing_patch.py server/g2b-proxy.py
          python3 tests/test_staffing_facts.py
          python3 tests/test_rfp_staffing_roles.py
          python3 tests/test_staffing_publish_evidence.py
          python3 tests/test_rfp_staffing_cached_backfill.py
          node tests/worklinks-staffing-facts-ui.cjs
      - name: Run new parser on exact official RFP bytes for three actual tenders
        run: python3 -u scripts/verify_three_live_staffing_sources.py
