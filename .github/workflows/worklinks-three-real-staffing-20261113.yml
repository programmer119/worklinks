name: WorkLinks three real staffing RFP checks
on:
  pull_request:
    paths:
      - 'scripts/verify_three_live_staffing_sources.py'
      - '.github/workflows/worklinks-three-real-staffing-20261113.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install real HWP PDF readers
        run: python3 -m pip install -q pyhwp pypdf Pillow
      - name: Run new parser on exact official RFP bytes for three actual tenders
        run: python3 -u scripts/verify_three_live_staffing_sources.py
