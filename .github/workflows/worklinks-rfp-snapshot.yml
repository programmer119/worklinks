name: WorkLinks official RFP eligibility snippets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worklinks-rfp-snapshot.yml'
      - 'scripts/refresh_worklinks_rfp.py'
      - 'tests/test_rfp_failures.py'
      - 'tests/test_rfp_rolling_coverage.py'
      - 'tests/test_rfp_quota_budget.py'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: worklinks-official-rfp-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Refresh RFP input baseline from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Install document readers
        run: python3 -m pip install --break-system-packages -q pyhwp pypdf
      - name: Verify per-cause classification
        run: |
          python3 tests/test_rfp_failures.py
          python3 tests/test_rfp_rolling_coverage.py
          python3 tests/test_rfp_quota_budget.py
          python3 tests/test_rfp_checkpoint.py
          python3 tests/test_rfp_ai.py
          python3 tests/test_worklinks_rfp_coverage.py
      - name: Recover checkpoint from last failed RFP publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=worklinks-rfp-checkpoint&per_page=20" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last | .id // empty')
          if [[ -z "$artifact_id" ]]; then
            echo 'RFP_CHECKPOINT_NONE'
            exit 0
          fi
          prior_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" --jq '.workflow_run.id')
          if [[ "$prior_run" == "$GITHUB_RUN_ID" ]]; then
            echo 'RFP_CHECKPOINT_SAME_RUN'
            exit 0
          fi
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$prior_run" --jq '.conclusion')
          if [[ "$conclusion" == success ]]; then
            echo "RFP_CHECKPOINT_ALREADY_PUBLISHED run=$prior_run"
            exit 0
          fi
          if [[ "$conclusion" != failure && "$conclusion" != cancelled ]]; then
            echo "RFP_CHECKPOINT_PRIOR_RUN_UNRESOLVED run=$prior_run conclusion=$conclusion"
            exit 1
          fi
          curl -fsSL --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            -o /tmp/worklinks-rfp-unpublished.zip
          python3 scripts/recover_worklinks_rfp_checkpoint.py /tmp/worklinks-rfp-unpublished.zip
      # The G2B bid-evidence proxy makes up to 3 upstream notice-service calls
      # per notice (region, e-order attachments, notice-detail). Until the
      # approved key quota is verified, budget 8 new scans + 2 metadata-only
      # change checks per hour: <= 720 upstream calls/day for THIS job only.
      # Other G2B consumers share upstream access and need separate budgets.
      - name: Extract quota-budgeted official RFP eligibility text
        run: python3 scripts/refresh_worklinks_rfp.py --limit 8
      - name: Checkpoint extracted RFP records before push
        uses: actions/upload-artifact@v4
        with:
          name: worklinks-rfp-checkpoint
          path: |
            startup-support/rfp-clauses.json
            startup-support/rfp-coverage-index.json
          if-no-files-found: error
          retention-days: 2
          compression-level: 7
      - name: Publish verified RFP snippets
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp startup-support/rfp-clauses.json /tmp/worklinks-rfp-new.json
          cp startup-support/rfp-coverage-index.json /tmp/worklinks-rfp-index-new.json
          # Retry from newest main instead of rebasing two snapshot JSON objects.
          # Merge by notice and keep prior readable text if a later API call is empty.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import datetime,json,pathlib,os
          from scripts.refresh_worklinks_rfp import bounded_detail_snapshot,MAX_PUBLISHED_RFP_BYTES
          dst=pathlib.Path('startup-support/rfp-clauses.json')
          new=json.loads(pathlib.Path('/tmp/worklinks-rfp-new.json').read_text())
          new_index=json.loads(pathlib.Path('/tmp/worklinks-rfp-index-new.json').read_text())
          old=json.loads(dst.read_text()) if dst.exists() else {'byNotice':{}}
          merged=dict(old.get('byNotice') or {})
          for key,item in (new.get('byNotice') or {}).items():
            prior=merged.get(key)
            if prior:
              if prior.get('status')=='text_extracted_requires_review' and item.get('status')!='text_extracted_requires_review':
                continue
              if item.get('checkedAt','') < prior.get('checkedAt',''):
                continue
            merged[key]=item
          bounded,omitted=bounded_detail_snapshot(merged)
          result={**new,'workflowRunId':os.environ.get('GITHUB_RUN_ID'),
                  'detailOmittedFromRollingCache':omitted,'byNotice':bounded}
          dst.write_text(json.dumps(result,ensure_ascii=False,separators=(',',':'))+'\n')
          if dst.stat().st_size>MAX_PUBLISHED_RFP_BYTES:
            raise SystemExit('RFP_DETAIL_SIZE_GUARD_FAILED')
          archive_path=pathlib.Path('startup-support/rfp-coverage-index.json')
          old_index=json.loads(archive_path.read_text()) if archive_path.exists() else {'byNotice':{}}
          indexed=dict(old_index.get('byNotice') or {})
          for key,item in (new_index.get('byNotice') or {}).items():
            prior=indexed.get(key) or {}
            if str(item.get('checkedAt') or '')>=str(prior.get('checkedAt') or ''):
              # A later missing/partial API scan must not erase earlier
              # authenticated official excerpts from the cumulative index.
              if prior.get('changcomClauseEvidence') and not item.get('changcomClauseEvidence'):
                item={**item,'changcomClauseEvidence':prior['changcomClauseEvidence']}
              indexed[key]=item
          archive={**new_index,'workflowRunId':os.environ.get('GITHUB_RUN_ID'),
                   'scannedNoticeCount':len(indexed),'byNotice':indexed}
          archive_path.write_text(json.dumps(archive,ensure_ascii=False,indent=2)+'\n')
          if archive_path.stat().st_size>=100_000_000:
            raise SystemExit('RFP_CUMULATIVE_INDEX_AT_GITHUB_BLOB_LIMIT')
          print('RFP_CUMULATIVE_SCANNED',len(indexed))
          print('RFP_MERGED_RECORDS',len(result['byNotice']))
          print('RFP_DETAIL_PUBLISHED_BYTES',dst.stat().st_size)
          print('RFP_DETAIL_OMITTED_FROM_ROLLING_CACHE',omitted)
          PY
            git add startup-support/rfp-clauses.json startup-support/rfp-coverage-index.json
            if git diff --cached --quiet; then echo 'RFP_SNAPSHOT_UNCHANGED'; exit 0; fi
            git commit -m 'data: merge G2B RFP evidence without dropping older snippets'
            if git push origin HEAD:main; then echo 'RFP_SNAPSHOT_PUBLISHED'; exit 0; fi
            echo "RFP_PUBLISH_CONFLICT_RETRY_$attempt"
            sleep 2
          done
          echo 'RFP_SNAPSHOT_PUBLISH_RETRIES_EXHAUSTED'
          exit 1
