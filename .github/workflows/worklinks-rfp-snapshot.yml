name: WorkLinks official RFP eligibility snippets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worklinks-rfp-snapshot.yml'
      - 'scripts/refresh_worklinks_rfp.py'
      - 'tests/test_rfp_failures.py'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: worklinks-official-rfp-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install document readers
        run: python3 -m pip install --break-system-packages -q pyhwp pypdf
      - name: Verify per-cause classification
        run: |
          python3 tests/test_rfp_failures.py
          python3 tests/test_rfp_ai.py
      - name: Extract limited official RFP eligibility text
        run: python3 scripts/refresh_worklinks_rfp.py --limit 64
      - name: Publish verified RFP snippets
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp startup-support/rfp-clauses.json /tmp/worklinks-rfp-new.json
          # Retry from newest main instead of rebasing two snapshot JSON objects.
          # Merge by notice and keep prior readable text if a later API call is empty.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import datetime,json,pathlib
          dst=pathlib.Path('startup-support/rfp-clauses.json')
          new=json.loads(pathlib.Path('/tmp/worklinks-rfp-new.json').read_text())
          old=json.loads(dst.read_text()) if dst.exists() else {'byNotice':{}}
          merged=dict(old.get('byNotice') or {})
          for key,item in (new.get('byNotice') or {}).items():
            prior=merged.get(key)
            if prior:
              if prior.get('status')=='text_extracted_requires_review' and item.get('status')!='text_extracted_requires_review':
                continue
              if item.get('checkedAt','') < prior.get('checkedAt',''):
                continue
            merged[key]=item
          result={**new,'byNotice':dict(list(merged.items())[-240:])}
          dst.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print('RFP_MERGED_RECORDS',len(result['byNotice']))
          PY
            git add startup-support/rfp-clauses.json
            if git diff --cached --quiet; then echo 'RFP_SNAPSHOT_UNCHANGED'; exit 0; fi
            git commit -m 'data: merge G2B RFP evidence without dropping older snippets'
            if git push origin HEAD:main; then echo 'RFP_SNAPSHOT_PUBLISHED'; exit 0; fi
            echo "RFP_PUBLISH_CONFLICT_RETRY_$attempt"
            sleep 2
          done
          echo 'RFP_SNAPSHOT_PUBLISH_RETRIES_EXHAUSTED'
          exit 1
