name: WorkLinks public SME verification probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-smpp-sme.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public SMPP SME lookup form
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,re,html
          url='https://smpp.go.kr/cst/smppInf/selectMiddlSslentrSchtwrListVw.do'
          try:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; WorkLinks-Official-SME-Verification/1.0)'})
            with urllib.request.urlopen(req,timeout=28) as f:
              raw=f.read()
              print('SMPP_HTTP_STATUS',f.status,'URL',f.url,'CONTENT_TYPE',f.headers.get('Content-Type'),'BYTES',len(raw))
            for codec in ['utf-8','euc-kr','cp949']:
              try:body=raw.decode(codec);print('DECODED_AS',codec);break
              except UnicodeDecodeError:pass
            else:body=raw.decode('utf-8','replace')
            def compact(value,limit=1500):
              return re.sub(r'\\s+',' ',html.unescape(value))[:limit]
            m=re.search(r'<form\\s+name="searchForm".*?</form>',body,re.S|re.I)
            print('SEARCH_FORM_FOUND',bool(m))
            if m:
              form=m.group(0)
              print('SEARCH_FORM_FIELDS',re.findall(r'name="([^"]+)"',form,re.I))
              print('SEARCH_FORM_INPUTS',re.findall(r'<input[^>]*>',form,re.I)[:18])
              for term in ['사업자등록번호','검색','searchBsnmNo','searchNm','onclick=']:
                for match in list(re.finditer(term,form,re.I))[:4]:
                  print('FORM_LOOKUP',term,compact(form[max(0,match.start()-200):match.start()+330],530))
            for marker in ['function fn_search','function fn_getList','function fn_searchData','function fn_searchList','function fn_selectList','function fn_getSearch','function fn_searchBtn']:
              pos=body.find(marker)
              print('JS_FN',marker,pos,compact(body[pos:pos+1900],1900) if pos>=0 else '')
            for tag in re.findall(r'<script[^>]+src="([^"]+)"',body,re.I):
              if 'middl' in tag.lower() or 'smppInf' in tag:
                print('RELEVANT_SCRIPT',tag)
          except Exception as e:
            print('SMPP_PROBE_ERROR',type(e).__name__,str(e)[:250])
            raise
          PY
