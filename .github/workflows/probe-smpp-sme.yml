name: WorkLinks public SME verification probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-smpp-sme.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public SMPP SME lookup form
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,re,html
          url='https://smpp.go.kr/cst/smppInf/selectMiddlSslentrSchtwrListVw.do'
          try:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; WorkLinks-Official-SME-Verification/1.0)'})
            with urllib.request.urlopen(req,timeout=28) as f:
              raw=f.read()
              print('SMPP_HTTP_STATUS',f.status,'URL',f.url,'CONTENT_TYPE',f.headers.get('Content-Type'),'BYTES',len(raw))
            for codec in ['utf-8','euc-kr','cp949']:
              try:body=raw.decode(codec);print('DECODED_AS',codec);break
              except UnicodeDecodeError:pass
            else:body=raw.decode('utf-8','replace')
            for term in ['name="searchForm"','searchBsnmNo','searchEntrpsNm','selectMiddlSslentrSchtwrListVw.do','fn_search','fnSearch','searchMiddl','selectMiddl','searchEntrps','기업규모','유효여부','fn_getList']:
              hits=[m.start() for m in re.finditer(re.escape(term),body,re.I)]
              print('LOOKUP_TERM',term,'COUNT',len(hits))
              for pos in hits[-7:]:
                print('LOOKUP_CONTEXT',term,html.unescape(body[max(0,pos-450):min(len(body),pos+540)]).replace('\\n',' ')[:1000])
            m=re.search(r'<form\\s+name="searchForm".*?</form>',body,re.S|re.I)
            if m:
              content=m.group(0)
              print('SEARCH_FORM_LENGTH',len(content))
              print('SEARCH_FORM_FIELDS',re.findall(r'name="([^"]+)"',content,re.I))
              for match in re.finditer('onclick=|검색|사업자등록번호',content,re.I):
                i=match.start()
                print('FORM_ACTION',html.unescape(content[max(0,i-120):i+250]).replace('\\n',' ')[:390])
          except Exception as e:
            print('SMPP_PROBE_ERROR',type(e).__name__,str(e)[:250])
            raise
          PY
