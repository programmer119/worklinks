name: WorkLinks 121 unresolved RFP cause live audit 20261116
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/worklinks-rfp-121-live-audit-20261116.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch authoritative live 121 report without government calls
        shell: bash
        run: |
          python3 - <<'PY'
          import collections,gzip,json,urllib.request
          base='https://api-suaveforge.suaveforge.com:18458/api/g2b/'
          def fetch(name):
              req=urllib.request.Request(base+name,headers={'Accept-Encoding':'gzip',
                'User-Agent':'WorkLinks-121-Cause-Audit-ReadOnly/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  raw=r.read()
                  if r.headers.get('Content-Encoding')=='gzip':raw=gzip.decompress(raw)
              return json.loads(raw)
          progress=fetch('rfp-rescan-progress')
          cause=fetch('rfp-rescan-causes?limit=150&offset=0')
          attribution=fetch('rfp-ocr-repair-attribution')
          print('RFP121_COUNTS',json.dumps({'asOf':cause.get('asOf'),'expected':cause.get('counts'),
            'actual':cause.get('actualIssueNoticeCount'),'root':cause.get('primaryCauseCounts'),
            'category':cause.get('categoryCounts'),'overlaps':cause.get('overlappingIssueNoticeCounts'),
            'fileErrors':cause.get('problemFileErrorCounts'),'scanStatus':progress.get('worker')},
            ensure_ascii=False,separators=(',',':')),flush=True)
          print('RFP121_OCR_ATTRIBUTION',json.dumps(attribution,ensure_ascii=False,separators=(',',':')),flush=True)
          by=collections.defaultdict(list)
          for row in cause.get('records') or []:
              root=row.get('rootCause','other')
              sample={'notice':row.get('noticeKey'),'deadline':row.get('deadline'),
                'status':row.get('scanStatus'),'files':[
                  {'name':f.get('name'),'error':f.get('errorCategory'),'reason':f.get('reason'),
                   'attempt':f.get('lastReaderAttemptVersion'),'detail':f.get('errorDetail'),
                   'format':f.get('detectedFormat'),'deferred':f.get('ocrBatchDeferredPages'),
                   'ocrFailed':f.get('ocrFailedPages'),'pdfs':f.get('pdfSources')}
                  for f in (row.get('files') or [])[:4]]}
              by[root].append(sample)
          for category,items in by.items():
              print('RFP121_ROOT_GROUP',json.dumps({'root':category,'count':len(items),'samples':items[:12]},
                ensure_ascii=False,separators=(',',':')),flush=True)
          assert cause.get('upstreamCalls')==0
          PY
# v13 postdeploy live audit after OCR fairness + XML HWPML + sparse-page fallback

# v14 after verified production deployment, 20261116

  export-current-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read server123 RFP live diagnosis and publish compact results to audit branch
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime,gzip,json,urllib.request
          from pathlib import Path
          base='https://api-suaveforge.suaveforge.com:18458/api/g2b/'
          report={'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'mode':'read_only','upstreamCalls':0}
          for key,url in [
            ('progress','rfp-rescan-progress'),
            ('causes','rfp-rescan-causes?limit=150&offset=0'),
            ('attribution','rfp-ocr-repair-attribution')]:
              try:
                req=urllib.request.Request(base+url,headers={'Accept-Encoding':'gzip',
                  'User-Agent':'WorkLinks-Live-RFP-Cause-Audit/1.0','Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=65) as response:
                  raw=response.read()
                  if response.headers.get('Content-Encoding')=='gzip':raw=gzip.decompress(raw)
                data=json.loads(raw)
                if key=='causes':cause_data=data
                if key=='progress':
                  report[key]={k:data.get(k) for k in ('asOf','counts','worker','lanes','activity','stages')}
                elif key=='causes':
                  report[key]={k:data.get(k) for k in ('asOf','counts','actualIssueNoticeCount',
                    'primaryCauseCounts','categoryCounts','overlappingIssueNoticeCounts','problemFileErrorCounts','upstreamCalls')}
                  report['problemNotices']=[
                    {'noticeKey':row.get('noticeKey'),'rootCause':row.get('rootCause'),
                     'scanStatus':row.get('scanStatus'),'reason':row.get('reason'),
                     'files':[{'name':file.get('name'),'errorCategory':file.get('errorCategory'),
                       'reason':file.get('reason'),'errorDetail':file.get('errorDetail'),
                       'lastReaderAttemptVersion':file.get('lastReaderAttemptVersion'),
                       'detectedFormat':file.get('detectedFormat'),
                       'ocrBatchDeferredPages':file.get('ocrBatchDeferredPages'),
                       'ocrFailedPages':file.get('ocrFailedPages')}
                       for file in (row.get('files') or [])]}
                    for row in (data.get('records') or [])]
                else:
                  report[key]=data
              except Exception as e:
                report[key+'Error']=type(e).__name__+': '+str(e)[:500]
          report['pdfOcrFiles']=[]
          # Exact OCR failures only; no upstream document downloads.
          if isinstance(cause_data,dict):
            for row in cause_data.get('records') or []:
              files=[f for f in (row.get('files') or []) if f.get('errorCategory')=='pdf_ocr_incomplete']
              if not files:continue
              report['pdfOcrFiles'].append({
                'noticeKey':row.get('noticeKey'),
                'deadline':row.get('deadline'),
                'rootCause':row.get('rootCause'),
                'files':[{
                  'name':f.get('name'),
                  'errorCategory':f.get('errorCategory'),
                  'errorDetail':f.get('errorDetail'),
                  'lastReaderAttemptVersion':f.get('lastReaderAttemptVersion'),
                  'lastReaderAttemptAt':f.get('lastReaderAttemptAt'),
                  'ocrBatchDeferredPages':f.get('ocrBatchDeferredPages'),
                  'ocrFailedPages':f.get('ocrFailedPages'),
                  'pdfSources':(f.get('pdfSources') or [])[:4],
                  'extractionEvidence':{k:v for k,v in (f.get('extractionEvidence') or {}).items()
                    if k in ('pdfPages','ocrAttemptedPages','ocrRecoveredPages','ocrRestoredPages',
                       'ocrBatchDeferredPages','ocrFailedPages','unresolvedPages','ocrFailureDetails')}
                } for f in files]})
          target=Path('diagnostics/rfp-pdf-ocr-details-20261116.json')
          target.parent.mkdir(exist_ok=True)
          target.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('AUDIT_COUNTS',json.dumps(report.get('progress',{}).get('counts'),ensure_ascii=False),flush=True)
          print('AUDIT_ROOT',json.dumps(report.get('causes',{}).get('primaryCauseCounts'),ensure_ascii=False),flush=True)
          print('AUDIT_ERRORS',json.dumps({k:v for k,v in report.items() if k.endswith('Error')},ensure_ascii=False),flush=True)
          PY
          git config user.name "worklinks-audit-bot"
          git config user.email "worklinks-audit-bot@users.noreply.github.com"
          git add diagnostics/rfp-pdf-ocr-details-20261116.json
          git commit -m "audit: save read-only production RFP diagnosis"
          git push origin HEAD:refs/heads/diagnostics/rfp-ocr-details-20261116
