name: WorkLinks active RFP rescan progress regression
on:
  push:
    branches: [main]
    paths:
      - 'server/g2b-proxy.py'
      - 'server/worklinks-server123-pipeline.py'
      - 'scripts/refresh_worklinks_rfp.py'
      - 'startup-support/index.html'
      - 'tests/test_rfp_rescan_progress.py'
      - 'tests/test_rfp_rolling_coverage.py'
      - 'tests/test_rfp_upgrade_queue.py'
      - 'tests/test_rfp_rescan_ui.py'
      - '.github/workflows/worklinks-rfp-rescan-progress-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate backend code and pure progress calculations
        run: |
          python3 -m py_compile server/g2b-proxy.py server/worklinks-server123-pipeline.py scripts/refresh_worklinks_rfp.py
          python3 tests/test_rfp_rescan_progress.py
          python3 tests/test_worklinks_server123_pipeline.py
          python3 tests/test_rfp_rolling_coverage.py
          python3 tests/test_rfp_upgrade_queue.py
      - name: Verify inline script syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re
          html=pathlib.Path('startup-support/index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          assert scripts
          pathlib.Path('/tmp/worklinks-rfp-rescan-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/worklinks-rfp-rescan-inline.js
      - name: Install browser regression dependencies
        run: |
          python3 -m pip install -q playwright
          python3 -m playwright install chromium
      - name: Browser-test progress button and popup against deterministic saved-data fixture
        shell: bash
        run: |
          python3 -m http.server 18766 --bind 127.0.0.1 --directory . >/tmp/rfp-progress-http.log 2>&1 &
          python3 tests/test_rfp_rescan_ui.py
