name: WorkLinks batch page throttle regression with daily quota only
on:
  push:
    branches: [fix/rfp-remove-arbitrary-hourly-cap-20261115]
    paths:
      - 'scripts/rfp_bulk_manifests.py'
      - '.github/workflows/worklinks-rfp-no-idle-hour-ci-20261115.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify adaptive 8-slot manifest release with provider cooldown and date-batch cap
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/rfp_bulk_manifests.py
          python3 tests/test_rfp_quota_resume.py
          python3 tests/test_rfp_bulk_manifests.py
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          import rfp_bulk_manifests as b
          assert b.HOURLY_LIMIT==b.DAILY_LIMIT==180
          print('RFP_ARTIFICIAL_36_PER_HOUR_THROTTLE_REMOVED=PASS')
          PY
          echo RFP_DAILY_LIMIT_PRESERVED=PASS
