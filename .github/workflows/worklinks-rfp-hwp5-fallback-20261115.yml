name: WorkLinks HWP5 record fallback and malformed HML
on:
  push:
    branches: [fix/rfp-hwp5-record-fallback-20261115, main]
    paths:
      - scripts/refresh_worklinks_rfp.py
      - scripts/repair_open_rfp_cached_attachments.py
      - server/worklinks-server123-pipeline.py
      - tests/test_rfp_hwp_records_fallback_20261115.py
      - .github/workflows/worklinks-rfp-hwp5-fallback-20261115.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate HWP paragraphs and fail-closed damaged HML
        run: |
          python3 -m py_compile scripts/refresh_worklinks_rfp.py scripts/repair_open_rfp_cached_attachments.py
          python3 tests/test_rfp_hwp_records_fallback_20261115.py
          python3 tests/test_rfp_long_document_coverage_20261115.py
          python3 tests/test_rfp_repair_error_provenance_20261115.py
          python3 tests/test_open_cached_rfp_repair.py
          python3 tests/test_rfp_verified_file_handoff.py
          python3 tests/test_rfp_ocr_repair_prioritization_20261115.py
          echo RFP_HWP5_RECORD_FALLBACK_NO_NETWORK_REGRESSION=PASS
