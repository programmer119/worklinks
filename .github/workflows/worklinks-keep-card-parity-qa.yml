name: WorkLinks keep and watch original-card browser QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worklinks-keep-card-parity-qa.yml'
      - 'startup-support/index.html'
      - 'startup-support/worklinks-keep.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium for real card click and layout checks
        run: |
          python3 -m pip install -q playwright
          python3 -m playwright install chromium
      - name: Validate six kept cards are original clickable job thumbnails
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright
          base='https://worklinks.suaveforge.com/startup-support/'
          root=(pathlib.Path.cwd()/'startup-support').resolve()
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1440,'height':1000},device_scale_factor=1)
              def serve_checkout(route):
                  path=urlparse(route.request.url).path.split('/startup-support/',1)[-1]
                  target=(root/(path or 'index.html')).resolve()
                  if target.is_file() and target.is_relative_to(root):
                      typ='application/javascript' if target.suffix=='.js' else (
                          'text/css' if target.suffix=='.css' else (
                          'text/html' if target.suffix=='.html' else 'text/plain'))
                      route.fulfill(status=200,content_type=typ,body=target.read_bytes())
                  else:
                      route.continue_()
              # Same production origin/API, but exact source from this commit.
              # No user account, token, or production record is modified.
              page.route('https://worklinks.suaveforge.com/startup-support/**',serve_checkout)
              page.goto(base+'?view=jobs',wait_until='domcontentloaded',timeout=60000)
              page.wait_for_function("typeof renderJobs==='function' && typeof window.worklinksHydrateKeptJobs==='function' && !!document.getElementById('jobCards')",timeout=35000)
              page.evaluate("""() => {
                // Simulate display-only logged-in context. Never forge server tokens.
                document.querySelector('body > main').inert=false;
                document.getElementById('worklinks-auth-gate').hidden=true;
                window.worklinksMemberAuthenticated=true;
                document.documentElement.dataset.worklinksPartnerAccess='granted';
                jobFilter='all'; jobVerdictFilter='all'; jobRenderLimit=100;
                setWorkspaceView('jobs');
                startJobsDataWhenVisible();
              }""")
              page.wait_for_function("jobsInitialDataReady && document.querySelectorAll('#jobCards .job-mini[data-job-card]').length>=6",timeout=90000)
              sample=page.evaluate("""() => {
                const cards=[...document.querySelectorAll('#jobCards article.job-mini[data-job-card]')].slice(0,6);
                const items=cards.map(el=>({id:el.dataset.jobCard,...window.worklinksKeepSnapshotFor(el.dataset.jobCard)}));
                if(items.length!==6)throw Error('six original job cards not available');
                window.__qaItems=items;
                // Mock the two member API responses only inside this QA browser.
                window.worklinksKeepCurrentUser=()=> 'qa-member-11111111';
                window.worklinksKeepRequest=async path=>{
                  if(path==='/worklinks-keep')return {ok:true,items,shareEnabled:true,shareAlias:'QA member'};
                  if(path==='/worklinks-keep-members')return {ok:true,members:[
                    {id:'member-22222222',name:'Other member',count:6}]};
                  if(path.startsWith('/worklinks-keep-watch?'))return {ok:true,
                    readOnly:true,items,member:{id:'member-22222222',name:'Other member'}};
                  throw Error('QA attempted unsupported API '+path);
                };
                document.documentElement.dataset.worklinksAuthState='granted';
                window.dispatchEvent(new Event('worklinks:partner-access'));
                return {ids:items.map(x=>x.id)};
              }""")
              page.wait_for_function("""() => window.worklinksKeeps?.has(window.__qaItems[0].id) &&
                document.getElementById('keepMineCount')?.textContent==='6'""",timeout=20000)
              page.evaluate("""() => {
                document.getElementById('keepModeAll').click();
                renderJobs();
                window.__qaBaseCards=new Map([...document.querySelectorAll('#jobCards article.job-mini')]
                  .filter(el=>window.__qaItems.some(item=>item.id===el.dataset.jobCard))
                  .map(el=>[el.dataset.jobCard,el.cloneNode(true)]));
              }""")
              # In the isolated QA browser, AuthHub correctly locks an actual
              # guest. Enable the fixture surface, then exercise the real button
              # event (the production authenticated view is not inert).
              page.evaluate("""() => {
                document.querySelector('body > main').inert=false;
                document.getElementById('worklinks-auth-gate').hidden=true;
                document.getElementById('keepModeMine').click();
              }""")
              page.wait_for_function("""() =>
                document.querySelector('#jobsView')?.dataset.keepMode==='mine' &&
                document.querySelectorAll('#jobCards article.job-mini[data-job-card]').length===6""",timeout=20000)
              owned=page.evaluate("""() => {
                const norm=el=>{const copy=el.cloneNode(true);
                  copy.querySelectorAll('[data-keep-toggle]').forEach(button=>button.remove());
                  return copy.outerHTML};
                const cards=[...document.querySelectorAll('#jobCards article.job-mini[data-job-card]')];
                return {count:cards.length,ids:cards.map(el=>el.dataset.jobCard),
                  identical:cards.every(el=>window.__qaBaseCards.has(el.dataset.jobCard)&&
                    norm(window.__qaBaseCards.get(el.dataset.jobCard))===norm(el)),
                  interactive:cards.every(el=>el.querySelector('.job-day')&&
                    el.querySelector('[data-job-detail]')&&el.querySelector('[data-external-source]')&&
                    el.querySelector('[data-keep-toggle]'))};
              }""")
              # Real browser pointer click; not a synthetic direct function call.
              page.evaluate("""() => {
                document.querySelector('body > main').inert=false;
                document.getElementById('worklinks-auth-gate').hidden=true;
              }""")
              page.locator('#jobCards article.job-mini[data-job-card]').first.click(timeout=12000,force=True)
              clicked=page.evaluate("({selected:activeDetailJobId,expected:window.__qaItems[0].id})")
              page.evaluate("document.getElementById('keepModeWatch').click()")
              page.wait_for_function("""() => document.getElementById('keepMemberSelect').options.length===2""",timeout=15000)
              page.evaluate("""() => {
                const select=document.getElementById('keepMemberSelect');
                select.value='member-22222222';
                select.dispatchEvent(new Event('change',{bubbles:true}));
              }""")
              page.wait_for_function("""() => document.querySelector('#jobsView')?.dataset.keepMode==='watch' &&
                window.worklinksKeeps.activeItems().length===6 &&
                document.querySelectorAll('#jobCards article.job-mini[data-job-card]').length===6""",timeout=20000)
              watched=page.evaluate("""() => {
                const norm=el=>{const copy=el.cloneNode(true);
                  copy.querySelectorAll('[data-keep-toggle]').forEach(button=>button.remove());
                  return copy.outerHTML};
                const cards=[...document.querySelectorAll('#jobCards article.job-mini[data-job-card]')];
                return {count:cards.length,identical:cards.every(el=>
                  window.__qaBaseCards.has(el.dataset.jobCard)&&
                  norm(window.__qaBaseCards.get(el.dataset.jobCard))===norm(el)),
                  readOnly:cards.every(el=>!el.querySelector('[data-keep-toggle]')),
                  clickable:cards.every(el=>!!el.querySelector('[data-job-detail]')&&
                    !!el.querySelector('[data-external-source]'))};
              }""")
              result={'sample':sample,'owned':owned,'watch':watched,'click':clicked}
              print('WORKLINKS_KEEP_CARD_BROWSER_CHECK',json.dumps(result,ensure_ascii=False),flush=True)
              assert owned['count']==6 and watched['count']==6,result
              assert owned['identical'] and watched['identical'],result
              assert owned['interactive'] and watched['readOnly'] and watched['clickable'],result
              assert clicked['selected']==clicked['expected'],result
              print('WORKLINKS_KEPT_SIX_ORIGINAL_CARD_AND_DETAIL_CLICK=PASS')
              browser.close()
          PY
