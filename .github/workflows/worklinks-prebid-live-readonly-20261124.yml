name: Audit WorkLinks prebid and plan live (read only 20261124)
on:
  push:
    branches:
      - audit/prebid-live-readonly-20261124
    paths:
      - .github/workflows/worklinks-prebid-live-readonly-20261124.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read live production API without touching DB
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime,json,urllib.request,urllib.error
          base="https://api-suaveforge.suaveforge.com:18458/api/g2b"
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          print("PROBE_UTC",now,flush=True)
          for stage in ("prespec","plan"):
            for offset in (0,500):
              url=base+"/prebid?stage="+stage+"&limit=500&offset="+str(offset)
              try:
                req=urllib.request.Request(url,headers={"User-Agent":"WorkLinksPrebidReadOnlyAudit/20261124","Cache-Control":"no-cache"})
                with urllib.request.urlopen(req,timeout=30) as response:
                  doc=json.load(response)
                  code=response.status
                if not isinstance(doc,dict):raise ValueError("not_object")
                items=doc.get("items",[])
                print("PREBID_CHECK",json.dumps({"stage":stage,"offset":offset,"http":code,"ok":doc.get("ok"),"ready":doc.get("ready"),"total":doc.get("total"),"asOf":doc.get("asOf"),"lastSuccess":doc.get("lastSuccess"),"error":doc.get("error"),"rowCount":len(items) if isinstance(items,list) else -1,"firstIds":[x.get("id") for x in items[:3]] if isinstance(items,list) else []},ensure_ascii=False),flush=True)
              except Exception as e:
                print("PREBID_ERROR",stage,offset,type(e).__name__,str(e)[:160],flush=True)
                break
          for endpoint in ("/crawl-status", "/pipeline-status"):
            try:
              req=urllib.request.Request(base+endpoint,headers={"User-Agent":"WorkLinksPrebidReadOnlyAudit/20261124","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=20) as response:doc=json.load(response)
              print("EXTRA_STATUS",endpoint,json.dumps(doc,ensure_ascii=False,default=str)[:2500],flush=True)
            except Exception as e:print("EXTRA_STATUS_ERROR",endpoint,type(e).__name__,str(e)[:160],flush=True)
          PY
