name: Audit WorkLinks prebid and plan live (read only 20261124)
on:
  push:
    branches:
      - audit/prebid-live-readonly-20261124
    paths:
      - .github/workflows/worklinks-prebid-live-readonly-20261124.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect plan every page slowly and classify upstream errors
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures,datetime,json,time,urllib.request,urllib.error
          base="https://api-suaveforge.suaveforge.com:18458/api/g2b"
          print("PROBE_START",datetime.datetime.now(datetime.timezone.utc).isoformat(),flush=True)
          def fetch(stage,offset):
            url=base+"/prebid?stage="+stage+"&limit=500&offset="+str(offset)
            errors=[]
            for attempt in range(5):
              try:
                req=urllib.request.Request(url,headers={"User-Agent":"WorkLinksPrebidSlowAudit/20261124","Cache-Control":"no-cache"})
                with urllib.request.urlopen(req,timeout=30) as response:
                  doc=json.load(response)
                  if response.status!=200:raise RuntimeError("http_"+str(response.status))
                return (offset,doc,errors)
              except Exception as e:
                errors.append(type(e).__name__+":"+str(getattr(e,"code",str(e)))[:65])
                if attempt<4:time.sleep(min(1+attempt,4))
            return (offset,None,errors)
          stage="plan"
          first=fetch(stage,0)
          if first[1] is None:raise RuntimeError("first_page_unavailable:"+str(first[2]))
          total=int(first[1]["total"]);asof=first[1].get("asOf")
          offsets=list(range(500,total,500))
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
            results=list(pool.map(lambda offset:fetch(stage,offset),offsets))
          issues=[];retries=[];received=0;ids=set()
          for offset,page,errs in [first]+results:
            if errs:retries.append({"offset":offset,"errors":errs})
            if page is None:
              issues.append({"offset":offset,"reason":"unavailable","attempt_errors":errs})
              continue
            items=page.get("items")
            if not (page.get("ok") is True and page.get("ready") is True and page.get("asOf")==asof and page.get("total")==total and isinstance(items,list) and len(items)==min(500,total-offset)):
              issues.append({"offset":offset,"reason":"inconsistent_response","count":len(items) if isinstance(items,list) else None,"asOf":page.get("asOf"),"total":page.get("total")})
            if isinstance(items,list):
              received+=len(items)
              for row in items:
                if not isinstance(row,dict) or not row.get("id"):issues.append({"offset":offset,"reason":"missing_id"});continue
                if row["id"] in ids:issues.append({"offset":offset,"reason":"duplicate_id","id":row["id"]})
                ids.add(row["id"])
          print("PLAN_FULL_RESULT",json.dumps({"total":total,"received":received,"pages":1+len(results),"asOf":asof,"issues":issues[:25],"issueCount":len(issues),"retriedPages":len(retries),"retryEvents":retries[:25]},ensure_ascii=False),flush=True)
          print("PROBE_END",datetime.datetime.now(datetime.timezone.utc).isoformat(),flush=True)
          PY
