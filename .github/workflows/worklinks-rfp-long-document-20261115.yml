name: WorkLinks long RFP source evidence coverage
on:
  push:
    branches: [fix/rfp-long-source-evidence-20261115, main]
    paths:
      - scripts/refresh_worklinks_rfp.py
      - scripts/repair_open_rfp_cached_attachments.py
      - server/worklinks-server123-pipeline.py
      - tests/test_rfp_long_document_coverage_20261115.py
      - .github/workflows/worklinks-rfp-long-document-20261115.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Long source scan and verified original regression
        run: |
          python3 -m py_compile scripts/refresh_worklinks_rfp.py scripts/repair_open_rfp_cached_attachments.py
          python3 tests/test_rfp_long_document_coverage_20261115.py
          python3 tests/test_rfp_repair_error_provenance_20261115.py
          python3 tests/test_open_cached_rfp_repair.py
          python3 tests/test_rfp_verified_file_handoff.py
          python3 tests/test_worklinks_server123_pipeline.py
          echo RFP_LONG_SOURCE_EVIDENCE_SAFE_GATE=PASS
