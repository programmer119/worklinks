name: WorkLinks Jobs visual and interaction QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worklinks-jobs-visual-qa.yml'
      - 'startup-support/index.html'
      - 'startup-support/rfp-clauses.json'
      - 'tests/test_worklinks_mobile_bootstrap.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser automation
        run: |
          python3 -m pip install -q playwright
          python3 -m playwright install chromium
      - name: Validate mobile first paint and incremental saved bids
        run: python3 tests/test_worklinks_mobile_bootstrap.py
      - name: Validate visible typography and hidden diagnostic helper
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1440,'height':900},device_scale_factor=1)
              page.goto('https://worklinks.suaveforge.com/startup-support/?view=jobs',wait_until='domcontentloaded',timeout=60000)
              page.locator('#jobsView.on').wait_for(timeout=25000)
              # Live browser tests run anonymously. Verify the partner panel is
              # protected, then simulate a granted member session in this test
              # page only; never change the production authorization guard.
              assert not page.evaluate("worklinksPartnerAccess()")
              assert page.locator('#jobDecisionSummary').is_hidden()
              page.evaluate("""() => {
                window.worklinksMemberAuthenticated=true;
                document.documentElement.dataset.worklinksPartnerAccess='granted';
                window.dispatchEvent(new Event('worklinks:partner-access'));
              }""")
              page.wait_for_function("worklinksPartnerAccess() && document.querySelector('#jobDecisionSummary')?.textContent?.includes('적격 후보')",timeout=30000)
              page.wait_for_function("window.g2bServerAvailable===true && window.g2bLiveJobs?.length>100",timeout=45000)
              # Wait for the rendered count, not a made-up minimum of one.
              # The current saved page can legitimately contain zero repeats.
              page.wait_for_function("""() => !jobRenderDirty &&
                !!document.querySelector('[data-verdict-count="repeat"]') &&
                document.querySelector('[data-verdict-count="repeat"]').textContent.trim() !== ''
              """,timeout=30000)
              # Real production dataset (often 2,000+ saved notices): profile
              # tab click-to-paint, not just the JavaScript click handler.
              desktop_paint=page.evaluate("""async () => {
                const times=[], longTasks=[];
                const watcher=new PerformanceObserver(list=>{
                  for(const task of list.getEntries())longTasks.push(Math.round(task.duration));
                });
                try{watcher.observe({entryTypes:['longtask']})}catch(e){}
                for(const target of ['sales','support','jobs','sales','jobs']){
                  const began=performance.now();
                  document.querySelector('.workspace-tab[data-view="'+target+'"]').click();
                  await new Promise(done=>requestAnimationFrame(()=>requestAnimationFrame(done)));
                  times.push({view:target,ms:Math.round(performance.now()-began),
                    cards:document.querySelectorAll('#jobCards .job-mini').length});
                }
                watcher.disconnect();
                return {times,longTasks,liveRows:g2bLiveJobs.length};
              }""")
              print('WORKLINKS_DESKTOP_LIVE_TAB_PAINT',json.dumps(desktop_paint,ensure_ascii=False))
              print('WORKLINKS_BROWSER_LIVE_DATA',page.evaluate("({serverAvailable:g2bServerAvailable,savedTotal:g2bSavedTotal,liveRows:g2bLiveJobs.length,visibleCards:document.querySelectorAll('#jobCards .job-mini').length})"))
              repeat=page.evaluate("""() => {
                const repeated=g2bLiveJobs.filter(x=>repeatYears(x)>=2);
                const tagged=g2bLiveJobs.filter(x=>Array.isArray(x.repeatHistory));
                const pages=g2bLiveJobs.length;
                return {liveRows:pages,historyAttached:tagged.length,
                  verifiedTwoPlus:repeated.length,
                  visibleBadges:document.querySelectorAll('#jobCards [data-history-id]').length,
                  examples:repeated.slice(0,10).map(x=>({
                    id:x.bidNo,title:x.title,repeatYears:repeatYears(x),
                    history:x.repeatHistory?.map(y=>({year:y.year,bidNo:y.bidNo,verified:y.verified}))}))};
              }""")
              print('WORKLINKS_REPEAT_AUDIT',json.dumps(repeat,ensure_ascii=False))
              proof=page.evaluate("""() => {
                const rows=collapseSimilarNotices(jobs.concat(g2bLiveJobs))
                  .filter(x=>jobSoftwareScope(x)==='candidate'&&
                    ['open','closing'].includes(jobTimeInfo(x).key));
                const repeat=rows.filter(x=>repeatYears(x)>=2);
                return {activeSW:rows.length,activeRepeatTwoPlus:repeat.length,
                  examples:repeat.slice(0,8).map(x=>({
                    title:x.title,notice:jobBidIdentity(x)?.bidNo,
                    years:repeatYears(x),
                    past:x.repeatHistory.filter(y=>y.bidNo).slice(0,2).map(y=>({year:y.year,bidNo:y.bidNo}))}))};
              }""")
              print('WORKLINKS_ACTIVE_REPEAT_COUNT',json.dumps(proof,ensure_ascii=False))
              repeats=page.evaluate("""() => {
                // Real AuthHub may reset our synthetic login while the long
                // public-data load runs. Keep this test browser's login grant
                // active just for this synchronous UI filter assertion.
                if(!worklinksPartnerAccess()){
                  window.worklinksMemberAuthenticated=true;
                  document.documentElement.dataset.worklinksPartnerAccess='granted';
                }
                // Use the same deduplicated active rows as renderJobs(); do not
                // confuse the full index with the currently loaded live page.
                const active=collapseSimilarNotices(
                  jobs.concat(g2bLiveJobs).filter(x=>!(x.kind&&jobSoftwareScope(x)==='out')))
                  .filter(x=>jobTimeInfo(x).key!=='closed');
                const expected=active.filter(x=>repeatYears(x)>=2).length;
                const before={filter:jobVerdictFilter,limit:jobRenderLimit};
                renderJobs();
                const displayed=Number(document.querySelector('[data-verdict-count="repeat"]')?.textContent||0);
                try{
                  jobVerdictFilter='repeat';jobRenderLimit=100;renderJobs();
                  const cards=[...document.querySelectorAll('#jobCards .job-mini')];
                  return {expected,displayed,count:cards.length,
                    badges:document.querySelectorAll('#jobCards .job-repeat[data-history-id]').length};
                }finally{
                  jobVerdictFilter=before.filter;jobRenderLimit=before.limit;renderJobs();
                }
              }""")
              assert repeats['displayed']==repeats['expected'],repeats
              assert repeats['count']==min(100,repeats['expected']),repeats
              if repeats['expected']>0:
                  assert repeats['badges']>0, 'existing verified repeats must render evidence badges'
              else:
                  assert repeats['count']==0 and repeats['badges']==0,repeats
              print('WORKLINKS_REPEAT_FILTER=PASS',json.dumps(repeats,ensure_ascii=False))

              # Probe exactly one known past award's public participant-count field;
              # never assume prtcptCnum is available for every notice.
              award=page.evaluate("""async () => {
                const past=g2bLiveJobs.flatMap(x=>(x.repeatHistory||[]).filter(y=>y.bidNo))
                  .find(y=>String(y.bidNo).startsWith('R25'));
                if(!past)return {state:'no_prior_bid'};
                try{
                  const d=await g2bFetch('/awards?bidNo='+encodeURIComponent(past.bidNo));
                  const exact=(d.items||[]).filter(y=>String(y.bidNtceNo||'')===String(past.bidNo));
                  return {state:'ok',bidNo:past.bidNo,rows:exact.length,
                    fields:exact[0]?Object.keys(exact[0]).filter(k=>/num|cnt|cnum|prtcpt|openg/i.test(k)).slice(0,16):[],
                    counts:exact.slice(0,4).map(y=>String(y.prtcptCnum??''))};
                }catch(e){return {state:'not_available',reason:String(e.message||e).slice(0,110)}}
              }""")
              print('WORKLINKS_OFFICIAL_COMPETITION_PROBE',json.dumps(award,ensure_ascii=False))
              live_competition=page.evaluate("""async () => {
                const x=g2bLiveJobs.find(x=>
                  /농식품 빅데이터 거래소.*운영.*유지관리/.test(String(x.title||''))&&
                  repeatYears(x)>=2);
                if(!x)return {ok:false,reason:'KADX recurring record not found'};
                const prior=previousOfficialBids(x)[0];
                if(!prior)return {ok:false,reason:'KADX prior notice not found'};
                try{
                  const data=await g2bFetch('/awards?bidNo='+encodeURIComponent(prior.bidNo));
                  const details=officialAwardDetails(data,prior.bidNo);
                  const n=details.count;
                  if(n===null)return {ok:false,reason:'official participant count absent',bidNo:prior.bidNo};
                  competitionByNotice.set(prior.bidNo,{...details,checkedAt:Date.now(),
                    source:'나라장터 낙찰정보서비스'});
                  const summary=pastCompetitionSummary(x);
                  const verdict=participationVerdict(x,partners[0]).type;
                  jobVerdictFilter='low-bids';renderJobs();
                  const filterCount=Number(document.querySelector('[data-verdict-count="low-bids"]')?.textContent||0);
                  const cards=document.querySelectorAll('#jobCards .job-mini').length;
                  jobVerdictFilter='all';renderJobs();
                  return {ok:true,bidNo:prior.bidNo,year:prior.year,participants:n,
                    awardRate:details.rate,awardAmount:details.amount,
                    winnerName:details.winner,winnerIdPresent:details.winnerBizno.length===10,
                    previousLow:summary.low,verdict,filterCount,cards};
                }catch(e){return {ok:false,reason:String(e.message||e).slice(0,100)}}
              }""")
              assert live_competition['ok'], live_competition
              assert live_competition['participants']==2
              assert live_competition['previousLow'] is True
              assert live_competition['awardRate'] is None or 0<live_competition['awardRate']<=100
              assert live_competition['awardAmount'] is None or live_competition['awardAmount']>0
              if live_competition['verdict']=='ready':
                assert live_competition['filterCount']>0
                assert live_competition['cards']>0
              print('WORKLINKS_KADX_REAL_LOW_COMPETITION=PASS',json.dumps(live_competition,ensure_ascii=False))
              history_ui=page.evaluate("""() => {
                const x=g2bLiveJobs.find(z=>z.noticeNumber==='R26BK01775500'||
                  /농식품 빅데이터 거래소.*운영.*유지관리/.test(String(z.title||'')));
                if(!x)return {ok:false,reason:'not_found'};
                for(const p of previousOfficialBids(x)){
                  if(!competitionByNotice.has(p.bidNo))
                    competitionByNotice.set(p.bidNo,{count:null,checkedAt:Date.now()});
                  contractByBid.set(p.bidNo,{confirmed:false,error:''});
                }
                openHistoryModal(x.id);
                refreshPastCompetitionText();
                const body=document.querySelector('#jobHistoryRows')?.innerText||'';
                const okay=body.includes('86.842%')&&
                  body.includes('2개사')&&body.includes('247500000')===false&&
                  body.includes('2억')&&body.includes('한국능률협회컨설팅')&&
                  body.includes('실제 계약:');
                document.getElementById('jobHistoryClose')?.click();
                return {ok:okay,excerpt:body.slice(0,580)};
              }""")
              assert history_ui['ok'],history_ui
              print('WORKLINKS_HISTORICAL_BID_UI=PASS',json.dumps(history_ui,ensure_ascii=False))
              # Verify actual browser presentation of DISTINCT contract numbers
              # using the already cached official contract register response.
              # Award data cannot substitute for contract evidence.
              contract_ui=page.evaluate("""async () => {
                const no='R25BK00820928',bizno='1168129581';
                const d=await g2bFetch('/contract-notice?bidNo='+no+'&bizno='+bizno);
                if(d.ok!==true)return {ok:false,error:d.error};
                const contracts=(d.contracts||[]).filter(z=>
                  z.companyBiznoMatched===true&&z.bidNo===no&&z.contractNo);
                contractByBid.set(no,{confirmed:contracts.length>0,count:contracts.length,
                  contractNumbers:contracts.map(z=>z.contractNo),
                  source:'계약정보서비스',date:contracts[0]?.date||'',
                  amount:Number(contracts[0]?.amount)||null,error:''});
                const x=g2bLiveJobs.find(z=>z.noticeNumber==='R26BK01775500'||
                  /농식품 빅데이터 거래소.*운영.*유지관리/.test(String(z.title||'')));
                if(!x)return {ok:false,error:'current_bid_absent'};
                openHistoryModal(x.id);
                refreshPastCompetitionText();
                const body=document.querySelector('[data-contract-status="'+no+'"]')?.textContent||'';
                document.getElementById('jobHistoryClose')?.click();
                return {ok:true,officialRows:d.totalCount,unique:d.uniqueContractNumbers,
                  duplicates:d.duplicateContractRows,conflicts:d.conflictingDuplicateRows,
                  companyMatched:contracts.every(z=>z.companyBiznoMatched),
                  contractNumbers:contracts.map(z=>z.contractNo),
                  visibleUnique:body.includes('고유 계약번호 3건'),
                  amountNotTotal:body.includes('전체 합산금액 아님'),
                  visibleNumber:body.includes('R25TA0057644402')};
              }""")
              assert contract_ui['ok'] and contract_ui['officialRows']==6,contract_ui
              assert contract_ui['unique']==3 and contract_ui['duplicates']==3,contract_ui
              assert contract_ui['conflicts']==0 and contract_ui['companyMatched'],contract_ui
              assert contract_ui['visibleUnique'] and contract_ui['amountNotTotal'] and contract_ui['visibleNumber'],contract_ui
              print('WORKLINKS_KADX_REAL_CONTRACT_UI=PASS',json.dumps(contract_ui,ensure_ascii=False))



              # Do not confuse the official past count with current bidders.
              assert page.evaluate("""() => officialAwardCount({
                items:[{bidNtceNo:'R25BK00820928',bidNtceOrd:'000',prtcptCnum:'2'}]
              },'R25BK00820928')""")==2
              assert page.evaluate("""() => officialAwardCount({
                items:[{bidNtceNo:'R25BK00820928',prtcptCnum:''}]
              },'R25BK00820928')""") is None



              page.wait_for_function("typeof rfpSnapshotByNotice !== 'undefined' && rfpSnapshotByNotice.size>0",timeout=25000)
              evidence=page.evaluate("""() => {
                const all=jobs.concat(g2bLiveJobs);
                for(const [key,item] of rfpSnapshotByNotice.entries()){
                  if(!Array.isArray(item.files)||!item.files.some(f=>f.readable))continue;
                  const x=all.find(y=>{const i=jobBidIdentity(y);return i && i.bidNo+':'+i.order===key});
                  if(!x)continue;
                  const clauses=directRfpRequirements(x);
                  if(!clauses.length)continue;
                  return {notice:key,sourceFiles:item.files.length,
                    sourceConditions:clauses.length,
                    verdict:participationVerdict(x,partners[0]).type};
                }
                return null;
              }""")
              # The 240-record rolling detail cache may contain zero of the
              # current 508 priority candidates. This is a coverage deficit,
              # not a DOM failure or evidence that those bids are ineligible.
              if evidence is None:
                  pending=page.evaluate("""() => ({
                    shortlist:changcomActionableData?.bids?.length||0,
                    citable:changcomActionableData?.verificationProgress?.citableRfpExtracts||0,
                    scanned:changcomActionableData?.verificationProgress?.rfpTextScanned||0
                  })""")
                  assert pending['shortlist']>0,pending
                  # Rolling 240-record RFP cache and cumulative evidence are
                  # separate stores. Missing a *direct* cache join must not
                  # falsely require accumulated official excerpts to be zero.
                  cumulative=page.evaluate("""() => {
                    const rows=changcomActionableData?.bids||[];
                    const cited=rows.filter(x=>Object.values(x.originalRequirementTypes||{})
                      .some(n=>Number(n)>0));
                    const valid=cited.filter(x=>{
                      const proof=x.officialClauseEvidence||{};
                      const source=Array.isArray(proof.files)&&proof.files.some(f=>
                        String(f.url||'').startsWith('https://www.g2b.go.kr/'));
                      const clauses=Object.values(proof.clauseCandidates||{})
                        .flat().some(c=>c&&c.sourceFile&&c.text&&
                          String(c.url||'').startsWith('https://www.g2b.go.kr/'));
                      return source&&clauses;
                    });
                    return {cited:cited.length,valid:valid.length,
                      samples:valid.slice(0,3).map(x=>x.bidNo+':'+x.order)};
                  }""")
                  assert cumulative['cited']==pending['citable'],(pending,cumulative)
                  assert cumulative['valid']==cumulative['cited'],(pending,cumulative)
                  print('WORKLINKS_LIVE_DIRECT_RFP_NO_JOIN_CUMULATIVE_EVIDENCE',
                        json.dumps({'pending':pending,'cumulative':cumulative},
                                   ensure_ascii=False))
              else:
                  assert evidence['sourceFiles']>0 and evidence['sourceConditions']>0
                  print('WORKLINKS_LIVE_DIRECT_RFP',json.dumps(evidence,ensure_ascii=False))
              # Record the exact remaining reason actual open tenders cannot complete.
              gate=page.evaluate("""() => {
                const all=collapseSimilarNotices(jobs.concat(g2bLiveJobs))
                  .filter(x=>jobSoftwareScope(x)==='candidate'&&
                    ['open','closing'].includes(jobTimeInfo(x).key));
                const counts={active:all.length,withRfpSnapshot:0,
                  withReadableDocs:0,completeScans:0,
                  officialSourceCoverage:0,reviewed:0,
                  missingMetadata:0,staleSnapshots:0,nonSimpleRules:0};
                const sample=[];
                for(const x of all){
                  const r=rfpSnapshotForJob(x);if(!r)continue;
                  counts.withRfpSnapshot++;
                  const fs=Array.isArray(r.files)?r.files:[];
                  if(fs.some(f=>f.readable))counts.withReadableDocs++;
                  const fullScan=fs.length>0&&r.manifestComplete===true&&
                    fs.every(f=>f.readable&&f.sourceTextScanComplete&&
                      f.unmatchedQualificationAnchorCount===0&&
                      !f.qualificationScanTruncated&&!f.clauseCandidatesTruncated);
                  if(fullScan)counts.completeScans++;
                  if(officialSourceCoverage(r,jobEvidenceData(x)))counts.officialSourceCoverage++;
                  else if(fullScan){
                    const evidence=jobEvidenceData(x);
                    const live=evidence?.attachments?.ok===true&&
                      evidence?.attachments?.complete===true;
                    const ts=Date.parse(r.checkedAt||'');
                    const recent=Number.isFinite(ts)&&Date.now()-ts<=86400000&&Date.now()-ts>=0;
                    if(!live&&!recent)counts.staleSnapshots++;
                    else counts.missingMetadata++;
                  }
                  const full=officialReviewCoverage(r,jobEvidenceData(x),x,partners[0]);
                  if(full)counts.reviewed++;
                  if(fullScan&&!full)counts.nonSimpleRules++;
                  if(sample.length<5&&fullScan)sample.push({
                    id:jobBidIdentity(x)?.bidNo,sourceFiles:fs.length,
                    autoReview:full, source:officialSourceCoverage(r,jobEvidenceData(x)),
                    types:[...new Set(fs.flatMap(f=>(f.clauseCandidates||[]).map(c=>c.type)))].slice(0,12)
                  });
                }
                return {counts,sample};
              }""")
              print('WORKLINKS_LIVE_SOURCE_GATES',json.dumps(gate,ensure_ascii=False))
              # The client must show truly checked industry status as one-click filters,
              # while no-license-restriction must NOT be called bid-ready.
              page.wait_for_function("partners.length>0 && !!partners[0].registryCheckedAt && partners[0].registryComplete===true",timeout=45000)
              industry_counts=page.evaluate("""() => {
                const match=Number(document.querySelector('[data-verdict-count="registered"]').textContent);
                const noRestriction=Number(document.querySelector('[data-verdict-count="no-restriction"]').textContent);
                const summary=document.querySelector('#jobDecisionSummary').textContent;
                return {match,noRestriction,summary};
              }""")
              assert industry_counts['match']>0,'official registered industry matches must be visible'
              assert industry_counts['noRestriction']>=0
              assert '등록업종 일치' in industry_counts['summary']
              assert '업종 제한 0건' in industry_counts['summary']
              page.locator('[data-verdict-filter="registered"]').click()
              assert page.locator('[data-verdict-filter="registered"]').get_attribute('aria-pressed')=='true'
              assert page.locator('#jobCards .job-mini').count()>0
              page.locator('[data-verdict-filter="all"]').click()
              # Provisional eligible screening includes unknowns, but final
              # confirmed and hard exclusions must remain distinguishable.
              provisional=page.evaluate("""() => {
                const xs=collapseSimilarNotices(jobs.concat(g2bLiveJobs))
                  .filter(x=>jobSoftwareScope(x)==='candidate' &&
                    ['open','closing'].includes(jobTimeInfo(x).key));
                const p=partners[0];
                const result={active:xs.length,provisional:0,confirmed:0,excluded:0,
                  unknownIndustryCandidates:0,samples:[]};
                for(const x of xs){
                  const v=participationVerdict(x,p);
                  const q=jobQualificationVerdict(x,p);
                  if(v.type==='ready'){
                    result.provisional++;
                    if(v.verified)result.confirmed++;
                    if(q.type==='unverified')result.unknownIndustryCandidates++;
                    if(result.samples.length<8)result.samples.push({
                      id:jobBidIdentity(x)?.bidNo,title:x.title,
                      industry:q.type,verified:v.verified,reason:v.reason});
                  } else if(v.type==='blocked') result.excluded++;
                }
                return result;
              }""")
              assert provisional['provisional']>0, 'unknowns should be eligible candidates'
              assert provisional['confirmed']<=provisional['provisional']
              assert provisional['provisional']+provisional['excluded']<=provisional['active']
              print('WORKLINKS_PROVISIONAL_ELIGIBILITY',json.dumps(provisional,ensure_ascii=False))
              print('WORKLINKS_LIVE_INDUSTRY_FILTERS=PASS',json.dumps(industry_counts,ensure_ascii=False))
              # Verify the shared public evidence snapshot, loaded without
              # extra live G2B calls, precedes user-triggered history research.
              page.wait_for_function("() => competitionByNotice.has('R25BK01238764')",
                                     timeout=20000)
              historical_reuse=page.evaluate("""() => {
                const a=competitionByNotice.get('R25BK01238764');
                const b=competitionByNotice.get('20241237450');
                return {count:competitionByNotice.size,
                  sameBizNo:!!a&&!!b&&a.winnerBizno===b.winnerBizno,
                  aCount:a?.count,bCount:b?.count,source:a?.source}
              }""")
              assert historical_reuse['sameBizNo'] and historical_reuse['aCount']==1 and historical_reuse['bCount']==1,historical_reuse
              print('WORKLINKS_OFFICIAL_AWARD_SNAPSHOT=PASS',json.dumps(historical_reuse,ensure_ascii=False))
              # The scheduled worker must update the SAME visible 1-3 chip
              # evidence source without direct upstream API calls in the UI.
              page.wait_for_function("""() => {
                const stored=competitionByNotice.get('20231126410');
                return !!stored&&stored.winnerBizno==='2538800257'&&stored.count===1;
              }""",timeout=30000)
              persisted_awards=page.evaluate("""async () => {
                const [history,status]=await Promise.all([
                  g2bFetch('/award-cache?limit=200&offset=0'),
                  g2bFetch('/award-cache-status')]);
                const row=competitionByNotice.get('20231126410');
                return {ok:history.ok,installed:history.installed,
                  count:history.totalCount,worker:status.installed,
                  hourCap:2,requestsLastRun:status.requestsLastRun,
                  exactHistoricalBid:row?.count===1&&row.winnerBizno==='2538800257',
                  oldVerifiedMapEntries:competitionByNotice.size,
                  source:row?.source};
              }""")
              assert persisted_awards['ok'] and persisted_awards['installed'],persisted_awards
              assert persisted_awards['worker'] and persisted_awards['count']>=27,persisted_awards
              assert persisted_awards['exactHistoricalBid'],persisted_awards
              assert persisted_awards['requestsLastRun']<=2,persisted_awards
              print('WORKLINKS_PERSISTED_AWARD_WORKER_VISUAL_QA=PASS',
                    json.dumps(persisted_awards,ensure_ascii=False))
              # Exercise both newly published buttons on the real page without
              # spending upstream quota. Existing unit tests prove the data rule.
              turnover_controls=page.evaluate("""() => {
                const original=loadPastCompetitionForJobs;
                loadPastCompetitionForJobs=()=>Promise.resolve();
                const result=[];
                try{
                  for(const code of ['low-changed','low-incumbent']){
                    const b=document.querySelector('[data-verdict-filter="'+code+'"]');
                    if(!b){result.push({code,found:false});continue}
                    b.click();
                    result.push({code,found:true,pressed:b.getAttribute('aria-pressed'),
                      selected:jobVerdictFilter,count:b.querySelector('[data-verdict-count]')?.textContent,
                      rendered:document.querySelectorAll('#jobCards .job-mini').length});
                  }
                  document.querySelector('[data-verdict-filter="all"]')?.click();
                }finally{loadPastCompetitionForJobs=original}
                return result;
              }""")
              assert len(turnover_controls)==2 and all(
                x.get('found') and x.get('pressed')=='true' and x.get('selected')==x.get('code')
                for x in turnover_controls),turnover_controls
              print('WORKLINKS_WINNER_TURNOVER_FILTERS=PASS',json.dumps(turnover_controls,ensure_ascii=False))
              # Validate that opportunities are ranked only *inside* suitable
              # eligibility candidates, and every visible chip has real evidence.
              # Suppress any additional on-demand research while clicking filters.
              opportunity_ui=page.evaluate("""() => {
                const previousLoad=loadPastCompetitionForJobs;
                const previousFilter=jobFilter;
                const previousVerdict=jobVerdictFilter;
                const previousSort=document.getElementById('jobSort').value;
                loadPastCompetitionForJobs=()=>Promise.resolve();
                const tiers=[];
                try{
                  jobFilter='all';jobVerdictFilter='all';
                  document.getElementById('jobSort').value='qualified';
                  renderJobs();
                  const current=[...document.querySelectorAll('#jobCards .job-mini')];
                  const tiered=current.map(c=>Number(c.querySelector('[data-advantage-tier]')?.dataset.advantageTier))
                    .filter(x=>[1,2,3].includes(x));
                  const sorted=tiered.every((n,i)=>i===0||tiered[i-1]>=n);
                  const unrated=current.some(c=>c.querySelector('[data-advantage-tier="unrated"]'));
                  const rows=collapseSimilarNotices(jobs.concat(g2bLiveJobs)
                    .filter(x=>!(x.kind&&jobSoftwareScope(x)==='out')))
                    .filter(x=>jobTimeInfo(x).key!=='closed');
                  for(const i of [3,2,1]){
                    const code='adv-'+i;
                    const expected=rows.filter(x=>matchesVerdictFilter(x,null,code)).length;
                    const b=document.querySelector('[data-verdict-filter="'+code+'"]');
                    if(!b){tiers.push({tier:i,found:false});continue}
                    b.click();
                    const cards=[...document.querySelectorAll('#jobCards .job-mini')];
                    const right=cards.every(card=>{
                      const indicator=card.querySelector('.job-advantage');
                      return indicator?.dataset.advantageTier===String(i)&&
                        indicator.querySelectorAll('.advantage-pill').length===i;
                    });
                    tiers.push({tier:i,found:true,expected,
                      count:Number(b.querySelector('[data-verdict-count]')?.textContent),
                      cards:cards.length,
                      pressed:b.getAttribute('aria-pressed')==='true',
                      selected:jobVerdictFilter===code,right});
                  }
                  return {tiers,sorted,unrated,visibleSample:tiered.slice(0,15)};
                }finally{
                  loadPastCompetitionForJobs=previousLoad;
                  jobFilter=previousFilter;jobVerdictFilter=previousVerdict;
                  document.getElementById('jobSort').value=previousSort;
                  renderJobs();
                }
              }""")
              assert opportunity_ui['sorted'] and opportunity_ui['unrated'],opportunity_ui
              assert len(opportunity_ui['tiers'])==3,opportunity_ui
              for value in opportunity_ui['tiers']:
                assert value['found'] and value['pressed'] and value['selected'],opportunity_ui
                assert value['count']==value['expected'],opportunity_ui
                assert value['cards']==min(100,value['count']),opportunity_ui
                assert value['right'],opportunity_ui
              print('WORKLINKS_ADVANTAGE_CHIPS_VISUAL_QA=PASS',json.dumps(opportunity_ui,ensure_ascii=False))
              # Identify real source-scanned, registered-industry candidates still blocked.
              # Each record shows why an otherwise relevant open notice does not go ready.
              missed=page.evaluate("""() => {
                const p=partners[0];
                const candidates=collapseSimilarNotices(jobs.concat(g2bLiveJobs))
                  .filter(x=>jobSoftwareScope(x)==='candidate'&&
                    ['open','closing'].includes(jobTimeInfo(x).key))
                  .map(x=>{
                    const id=jobBidIdentity(x);
                    const r=rfpSnapshotForJob(x);
                    if(!id||!r||!officialSourceCoverage(r,jobEvidenceData(x)))return null;
                    const q=jobQualificationVerdict(x,p);
                    if(!['industry_match','no_restriction'].includes(q.type))return null;
                    const verdict=participationVerdict(x,p);
                    if(verdict.type==='ready')return null;
                    const proof=comparePartnerJob(x,p);
                    const clauses=directRfpRequirements(x);
                    const counts={};
                    for(const c of clauses)counts[c.type]=(counts[c.type]||0)+1;
                    const blocked=proof.rows.filter(z=>z.status!=='ok');
                    const significant=['industry_code','sme_certificate',
                      'direct_production','performance_proof','staff_proof','region_restriction'];
                    const strong=clauses.filter(z=>significant.includes(z.type));
                    const procedural=['bid_security','submission_required',
                      'registration_identity','eligibility_cutoff','legal_exclusion',
                      'joint_participation','unclassified_qualification'];
                    const soft=clauses.filter(z=>procedural.includes(z.type));
                    return {id:id.bidNo,order:id.order,title:x.title,
                      closes:x.closes||'',industry:q.type,verdict:verdict.type,
                      sourceFiles:r.files?.length||0,clauses:clauses.length,
                      strong:strong.length,procedural:soft.length,
                      types:counts,
                      problems:blocked.slice(0,8).map(z=>({
                        name:z.label,status:z.status,reason:z.reason.slice(0,170)})),
                      examples:soft.slice(0,4).map(z=>({
                        type:z.type,text:z.sourceText.slice(0,160)}))};
                  }).filter(Boolean).sort((a,b)=>
                    (a.strong-b.strong)||(a.procedural-b.procedural)||
                    (a.problems.length-b.problems.length)||
                    String(a.closes).localeCompare(String(b.closes)));
                return {total:candidates.length,
                  noStrong:candidates.filter(x=>x.strong===0).length,
                  sample:candidates.slice(0,12)};
              }""")
              print('WORKLINKS_MISSED_SOURCE_CANDIDATES',json.dumps(missed,ensure_ascii=False))
              # Independently list actual open, citation-linked, closest-to-ready
              # notices; never print "ready" based on an industry-code match.
              candidates=page.evaluate("""() => {
                const seen=new Set();
                return jobs.concat(g2bLiveJobs)
                  .sort((x,y)=>(Number(y.noticeOrder)||0)-(Number(x.noticeOrder)||0))
                  .filter(x=>{
                  const id=jobBidIdentity(x);
                  if(!id||seen.has(id.bidNo))return false;
                  seen.add(id.bidNo);
                  return jobSoftwareScope(x)==='candidate' &&
                    ['open','closing'].includes(jobTimeInfo(x).key);
                }).map(x=>{
                  const p=partners[0],q=jobQualificationVerdict(x,p);
                  const result=comparePartnerJob(x,p),rfp=rfpSnapshotForJob(x);
                  const verdict=participationVerdict(x,p);
                  const id=jobBidIdentity(x);
                  return {bidNo:id.bidNo,order:id.order,title:x.title,
                    deadline:x.closes||x.deadline||x.endAt||'',
                    license:q.type,verdict:verdict.type,
                    reviewed:officialReviewCoverage(rfp,jobEvidenceData(x)),
                    documents:rfp?.files?.length||0,
                    pending:result.rows.filter(y=>y.status==='pending').slice(0,3)
                      .map(y=>y.label),
                    unknown:result.rows.filter(y=>y.status==='unknown').slice(0,3)
                      .map(y=>y.label),
                    missing:result.rows.filter(y=>y.status==='missing').slice(0,3)
                      .map(y=>y.label)};
                }).filter(x=>x.license==='industry_match'||x.license==='no_restriction')
                  .sort((a,b)=>{
                    const rank=x=>x.verdict==='ready'?0:x.verdict==='conditional'?1:
                      x.verdict==='checking'?2:3;
                    return rank(a)-rank(b) ||
                      (a.pending.length+a.unknown.length+a.missing.length)-
                      (b.pending.length+b.unknown.length+b.missing.length) ||
                      String(a.deadline).localeCompare(String(b.deadline));
                  }).slice(0,15);
              }""")
              print('WORKLINKS_LIVE_QUALIFIED_CANDIDATES',json.dumps(candidates,ensure_ascii=False))
              help=page.locator('#jobInfoFold')
              assert help.count()==1
              assert not help.evaluate('(e)=>e.open'),'diagnostics must be hidden by default'
              assert not page.locator('#g2bPanel').is_visible(),'API debug panel must be collapsed'
              assert not page.locator('#jobInfoFold .note').first.is_visible()
              fonts={key:page.locator(selector).first.evaluate('(e)=>parseFloat(getComputedStyle(e).fontSize)') for key,selector in [
                ('job_filter','.jobf'),('verdict_filter','.job-vf'),('job_title','#jobsView .job-titlebar>b'),
                ('job_sort','#jobSort')]}
              assert fonts['job_filter']>=16 and fonts['verdict_filter']>=16
              assert fonts['job_title']>=23 and fonts['job_sort']>=15
              page.locator('#jobInfoFold>summary').click()
              assert help.evaluate('(e)=>e.open')
              assert page.locator('#g2bPanel').is_visible(),'API debug panel should become visible after help click'
              assert page.locator('#jobMissingInfo').is_visible()
              assert page.locator('#jobInfoFold #bidGuide').count()==1,'nested bidder glossary must remain accessible'
              help.locator('summary').first.click()
              assert not help.evaluate('(e)=>e.open')
              print('WORKLINKS_JOBS_VISUAL_QA=PASS',json.dumps({'fonts_px':fonts,'ready_summary':page.locator('#jobDecisionSummary').text_content()[:230]},ensure_ascii=False))
              browser.close()
          PY
