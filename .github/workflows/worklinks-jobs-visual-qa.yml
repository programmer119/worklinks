name: WorkLinks Jobs visual and interaction QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worklinks-jobs-visual-qa.yml'
      - 'startup-support/index.html'
      - 'startup-support/rfp-clauses.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser automation
        run: |
          python3 -m pip install -q playwright
          python3 -m playwright install chromium
      - name: Validate visible typography and hidden diagnostic helper
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1440,'height':900},device_scale_factor=1)
              page.goto('https://worklinks.suaveforge.com/startup-support/?view=jobs',wait_until='domcontentloaded',timeout=60000)
              page.locator('#jobsView.on').wait_for(timeout=25000)
              page.wait_for_function("document.querySelector('#jobDecisionSummary')?.textContent?.includes('적격 후보')",timeout=30000)
              page.wait_for_function("window.g2bServerAvailable===true && window.g2bLiveJobs?.length>100",timeout=45000)
              print('WORKLINKS_BROWSER_LIVE_DATA',page.evaluate("({serverAvailable:g2bServerAvailable,savedTotal:g2bSavedTotal,liveRows:g2bLiveJobs.length,visibleCards:document.querySelectorAll('#jobCards .job-mini').length})"))
              repeat=page.evaluate("""() => {
                const repeated=g2bLiveJobs.filter(x=>repeatYears(x)>=2);
                const tagged=g2bLiveJobs.filter(x=>Array.isArray(x.repeatHistory));
                const pages=g2bLiveJobs.length;
                return {liveRows:pages,historyAttached:tagged.length,
                  verifiedTwoPlus:repeated.length,
                  visibleBadges:document.querySelectorAll('#jobCards [data-history-id]').length,
                  examples:repeated.slice(0,10).map(x=>({
                    id:x.bidNo,title:x.title,repeatYears:repeatYears(x),
                    history:x.repeatHistory?.map(y=>({year:y.year,bidNo:y.bidNo,verified:y.verified}))}))};
              }""")
              print('WORKLINKS_REPEAT_AUDIT',json.dumps(repeat,ensure_ascii=False))

              page.wait_for_function("typeof rfpSnapshotByNotice !== 'undefined' && rfpSnapshotByNotice.size>0",timeout=25000)
              evidence=page.evaluate("""() => {
                const all=jobs.concat(g2bLiveJobs);
                for(const [key,item] of rfpSnapshotByNotice.entries()){
                  if(!Array.isArray(item.files)||!item.files.some(f=>f.readable))continue;
                  const x=all.find(y=>{const i=jobBidIdentity(y);return i && i.bidNo+':'+i.order===key});
                  if(!x)continue;
                  const clauses=directRfpRequirements(x);
                  if(!clauses.length)continue;
                  return {notice:key,sourceFiles:item.files.length,
                    sourceConditions:clauses.length,
                    verdict:participationVerdict(x,partners[0]).type};
                }
                return null;
              }""")
              assert evidence is not None,'official source should join at least one live notice'
              assert evidence['sourceFiles']>0 and evidence['sourceConditions']>0
              print('WORKLINKS_LIVE_DIRECT_RFP',json.dumps(evidence,ensure_ascii=False))
              # Record the exact remaining reason actual open tenders cannot complete.
              gate=page.evaluate("""() => {
                const all=collapseSimilarNotices(jobs.concat(g2bLiveJobs))
                  .filter(x=>jobSoftwareScope(x)==='candidate'&&
                    ['open','closing'].includes(jobTimeInfo(x).key));
                const counts={active:all.length,withRfpSnapshot:0,
                  withReadableDocs:0,completeScans:0,
                  officialSourceCoverage:0,reviewed:0,
                  missingMetadata:0,staleSnapshots:0,nonSimpleRules:0};
                const sample=[];
                for(const x of all){
                  const r=rfpSnapshotForJob(x);if(!r)continue;
                  counts.withRfpSnapshot++;
                  const fs=Array.isArray(r.files)?r.files:[];
                  if(fs.some(f=>f.readable))counts.withReadableDocs++;
                  const fullScan=fs.length>0&&r.manifestComplete===true&&
                    fs.every(f=>f.readable&&f.sourceTextScanComplete&&
                      f.unmatchedQualificationAnchorCount===0&&
                      !f.qualificationScanTruncated&&!f.clauseCandidatesTruncated);
                  if(fullScan)counts.completeScans++;
                  if(officialSourceCoverage(r,jobEvidenceData(x)))counts.officialSourceCoverage++;
                  else if(fullScan){
                    const evidence=jobEvidenceData(x);
                    const live=evidence?.attachments?.ok===true&&
                      evidence?.attachments?.complete===true;
                    const ts=Date.parse(r.checkedAt||'');
                    const recent=Number.isFinite(ts)&&Date.now()-ts<=86400000&&Date.now()-ts>=0;
                    if(!live&&!recent)counts.staleSnapshots++;
                    else counts.missingMetadata++;
                  }
                  const full=officialReviewCoverage(r,jobEvidenceData(x),x,partners[0]);
                  if(full)counts.reviewed++;
                  if(fullScan&&!full)counts.nonSimpleRules++;
                  if(sample.length<5&&fullScan)sample.push({
                    id:jobBidIdentity(x)?.bidNo,sourceFiles:fs.length,
                    autoReview:full, source:officialSourceCoverage(r,jobEvidenceData(x)),
                    types:[...new Set(fs.flatMap(f=>(f.clauseCandidates||[]).map(c=>c.type)))].slice(0,12)
                  });
                }
                return {counts,sample};
              }""")
              print('WORKLINKS_LIVE_SOURCE_GATES',json.dumps(gate,ensure_ascii=False))
              # The client must show truly checked industry status as one-click filters,
              # while no-license-restriction must NOT be called bid-ready.
              page.wait_for_function("partners.length>0 && !!partners[0].registryCheckedAt && partners[0].registryComplete===true",timeout=45000)
              industry_counts=page.evaluate("""() => {
                const match=Number(document.querySelector('[data-verdict-count="registered"]').textContent);
                const noRestriction=Number(document.querySelector('[data-verdict-count="no-restriction"]').textContent);
                const summary=document.querySelector('#jobDecisionSummary').textContent;
                return {match,noRestriction,summary};
              }""")
              assert industry_counts['match']>0,'official registered industry matches must be visible'
              assert industry_counts['noRestriction']>=0
              assert '등록업종 일치' in industry_counts['summary']
              assert '업종 제한 0건' in industry_counts['summary']
              page.locator('[data-verdict-filter="registered"]').click()
              assert page.locator('[data-verdict-filter="registered"]').get_attribute('aria-pressed')=='true'
              assert page.locator('#jobCards .job-mini').count()>0
              page.locator('[data-verdict-filter="all"]').click()
              # Provisional eligible screening includes unknowns, but final
              # confirmed and hard exclusions must remain distinguishable.
              provisional=page.evaluate("""() => {
                const xs=collapseSimilarNotices(jobs.concat(g2bLiveJobs))
                  .filter(x=>jobSoftwareScope(x)==='candidate' &&
                    ['open','closing'].includes(jobTimeInfo(x).key));
                const p=partners[0];
                const result={active:xs.length,provisional:0,confirmed:0,excluded:0,
                  unknownIndustryCandidates:0,samples:[]};
                for(const x of xs){
                  const v=participationVerdict(x,p);
                  const q=jobQualificationVerdict(x,p);
                  if(v.type==='ready'){
                    result.provisional++;
                    if(v.verified)result.confirmed++;
                    if(q.type==='unverified')result.unknownIndustryCandidates++;
                    if(result.samples.length<8)result.samples.push({
                      id:jobBidIdentity(x)?.bidNo,title:x.title,
                      industry:q.type,verified:v.verified,reason:v.reason});
                  } else if(v.type==='blocked') result.excluded++;
                }
                return result;
              }""")
              assert provisional['provisional']>0, 'unknowns should be eligible candidates'
              assert provisional['confirmed']<=provisional['provisional']
              assert provisional['provisional']+provisional['excluded']<=provisional['active']
              print('WORKLINKS_PROVISIONAL_ELIGIBILITY',json.dumps(provisional,ensure_ascii=False))
              print('WORKLINKS_LIVE_INDUSTRY_FILTERS=PASS',json.dumps(industry_counts,ensure_ascii=False))
              # Identify real source-scanned, registered-industry candidates still blocked.
              # Each record shows why an otherwise relevant open notice does not go ready.
              missed=page.evaluate("""() => {
                const p=partners[0];
                const candidates=collapseSimilarNotices(jobs.concat(g2bLiveJobs))
                  .filter(x=>jobSoftwareScope(x)==='candidate'&&
                    ['open','closing'].includes(jobTimeInfo(x).key))
                  .map(x=>{
                    const id=jobBidIdentity(x);
                    const r=rfpSnapshotForJob(x);
                    if(!id||!r||!officialSourceCoverage(r,jobEvidenceData(x)))return null;
                    const q=jobQualificationVerdict(x,p);
                    if(!['industry_match','no_restriction'].includes(q.type))return null;
                    const verdict=participationVerdict(x,p);
                    if(verdict.type==='ready')return null;
                    const proof=comparePartnerJob(x,p);
                    const clauses=directRfpRequirements(x);
                    const counts={};
                    for(const c of clauses)counts[c.type]=(counts[c.type]||0)+1;
                    const blocked=proof.rows.filter(z=>z.status!=='ok');
                    const significant=['industry_code','sme_certificate',
                      'direct_production','performance_proof','staff_proof','region_restriction'];
                    const strong=clauses.filter(z=>significant.includes(z.type));
                    const procedural=['bid_security','submission_required',
                      'registration_identity','eligibility_cutoff','legal_exclusion',
                      'joint_participation','unclassified_qualification'];
                    const soft=clauses.filter(z=>procedural.includes(z.type));
                    return {id:id.bidNo,order:id.order,title:x.title,
                      closes:x.closes||'',industry:q.type,verdict:verdict.type,
                      sourceFiles:r.files?.length||0,clauses:clauses.length,
                      strong:strong.length,procedural:soft.length,
                      types:counts,
                      problems:blocked.slice(0,8).map(z=>({
                        name:z.label,status:z.status,reason:z.reason.slice(0,170)})),
                      examples:soft.slice(0,4).map(z=>({
                        type:z.type,text:z.sourceText.slice(0,160)}))};
                  }).filter(Boolean).sort((a,b)=>
                    (a.strong-b.strong)||(a.procedural-b.procedural)||
                    (a.problems.length-b.problems.length)||
                    String(a.closes).localeCompare(String(b.closes)));
                return {total:candidates.length,
                  noStrong:candidates.filter(x=>x.strong===0).length,
                  sample:candidates.slice(0,12)};
              }""")
              print('WORKLINKS_MISSED_SOURCE_CANDIDATES',json.dumps(missed,ensure_ascii=False))
              # Independently list actual open, citation-linked, closest-to-ready
              # notices; never print "ready" based on an industry-code match.
              candidates=page.evaluate("""() => {
                const seen=new Set();
                return jobs.concat(g2bLiveJobs)
                  .sort((x,y)=>(Number(y.noticeOrder)||0)-(Number(x.noticeOrder)||0))
                  .filter(x=>{
                  const id=jobBidIdentity(x);
                  if(!id||seen.has(id.bidNo))return false;
                  seen.add(id.bidNo);
                  return jobSoftwareScope(x)==='candidate' &&
                    ['open','closing'].includes(jobTimeInfo(x).key);
                }).map(x=>{
                  const p=partners[0],q=jobQualificationVerdict(x,p);
                  const result=comparePartnerJob(x,p),rfp=rfpSnapshotForJob(x);
                  const verdict=participationVerdict(x,p);
                  const id=jobBidIdentity(x);
                  return {bidNo:id.bidNo,order:id.order,title:x.title,
                    deadline:x.closes||x.deadline||x.endAt||'',
                    license:q.type,verdict:verdict.type,
                    reviewed:officialReviewCoverage(rfp,jobEvidenceData(x)),
                    documents:rfp?.files?.length||0,
                    pending:result.rows.filter(y=>y.status==='pending').slice(0,3)
                      .map(y=>y.label),
                    unknown:result.rows.filter(y=>y.status==='unknown').slice(0,3)
                      .map(y=>y.label),
                    missing:result.rows.filter(y=>y.status==='missing').slice(0,3)
                      .map(y=>y.label)};
                }).filter(x=>x.license==='industry_match'||x.license==='no_restriction')
                  .sort((a,b)=>{
                    const rank=x=>x.verdict==='ready'?0:x.verdict==='conditional'?1:
                      x.verdict==='checking'?2:3;
                    return rank(a)-rank(b) ||
                      (a.pending.length+a.unknown.length+a.missing.length)-
                      (b.pending.length+b.unknown.length+b.missing.length) ||
                      String(a.deadline).localeCompare(String(b.deadline));
                  }).slice(0,15);
              }""")
              print('WORKLINKS_LIVE_QUALIFIED_CANDIDATES',json.dumps(candidates,ensure_ascii=False))
              help=page.locator('#jobInfoFold')
              assert help.count()==1
              assert not help.evaluate('(e)=>e.open'),'diagnostics must be hidden by default'
              assert not page.locator('#g2bPanel').is_visible(),'API debug panel must be collapsed'
              assert not page.locator('#jobInfoFold .note').first.is_visible()
              fonts={key:page.locator(selector).first.evaluate('(e)=>parseFloat(getComputedStyle(e).fontSize)') for key,selector in [
                ('job_filter','.jobf'),('verdict_filter','.job-vf'),('job_title','#jobsView .job-titlebar>b'),
                ('job_sort','#jobSort')]}
              assert fonts['job_filter']>=16 and fonts['verdict_filter']>=16
              assert fonts['job_title']>=23 and fonts['job_sort']>=15
              page.locator('#jobInfoFold>summary').click()
              assert help.evaluate('(e)=>e.open')
              assert page.locator('#g2bPanel').is_visible(),'API debug panel should become visible after help click'
              assert page.locator('#jobMissingInfo').is_visible()
              assert page.locator('#jobInfoFold #bidGuide').count()==1,'nested bidder glossary must remain accessible'
              help.locator('summary').first.click()
              assert not help.evaluate('(e)=>e.open')
              print('WORKLINKS_JOBS_VISUAL_QA=PASS',json.dumps({'fonts_px':fonts,'ready_summary':page.locator('#jobDecisionSummary').text_content()[:230]},ensure_ascii=False))
              browser.close()
          PY
