name: RFP truncated original stream recovery regression 20261115
on:
  push:
    branches: [fix/rfp-retry-truncated-zip-20261115]
    paths:
      - 'scripts/rfp_download_worker.py'
      - 'tests/test_rfp_streamed_100mb.py'
      - '.github/workflows/worklinks-rfp-truncated-stream-ci-20261115.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Exercise 81MB stream and incomplete-then-complete ZIP response
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/rfp_download_worker.py
          python3 tests/test_rfp_streamed_100mb.py
          python3 tests/test_rfp_download_worker.py
          python3 tests/test_rfp_independent_workers_and_scan.py
          echo ZIP_LENGTH_MISMATCH_RETRY_FIX_PASS
