name: WorkLinks stale RFP single-call HTTP stop gate regression
on:
  push:
    branches: [fix/rfp-legacy-single-http-guard-20261115]
    paths:
      - 'server/g2b-proxy.py'
      - 'server/worklinks-server123-pipeline.py'
      - 'scripts/refresh_worklinks_rfp.py'
      - 'tests/test_rfp_legacy_single_guard.py'
      - '.github/workflows/worklinks-rfp-legacy-single-gate-ci-20261115.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify old automatic per-bid calls cannot escape dual RFP batches
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile server/g2b-proxy.py server/worklinks-server123-pipeline.py scripts/refresh_worklinks_rfp.py
          python3 tests/test_rfp_legacy_single_guard.py
          python3 tests/test_rfp_dual_queue.py
          python3 tests/test_rfp_download_worker.py
          python3 tests/test_rfp_bulk_manifests.py
          python3 tests/test_worklinks_server123_pipeline.py
          python3 tests/test_bid_evidence.py
          echo DUAL_RFP_SINGLE_UPSTREAM_DEFENSE=PASS
