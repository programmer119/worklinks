name: WorkLinks RFP rescan progress live read-only verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/worklinks-rfp-rescan-live-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Confirm actual server123 upgrade progress endpoint and breakdown
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json,datetime
          url='https://api-suaveforge.suaveforge.com:18458/api/g2b/rfp-rescan-progress'
          req=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
          try:
              with urllib.request.urlopen(req,timeout=35) as res:
                  data=json.load(res)
          except Exception as e:
              print('RFP_LIVE_PROGRESS_NOT_READY',type(e).__name__,str(e)[:170],flush=True)
              raise
          assert data.get('ok') is True and data.get('schemaVersion')==1,data
          x=data['counts']
          assert x['total']==x['completed']+x['remaining'],x
          assert x['rescanRequired']==x['legacy'],x
          assert x['total']>=x['rescanRequired'],x
          assert data['rescanPercent'] is None or 0<=data['rescanPercent']<=100
          assert data.get('noGovernmentApiCalls') is True,data
          print('RFP_LIVE_PROGRESS_VERIFIED',json.dumps({
              'asOf':data.get('asOf'),'latest':data.get('latest'),
              'rescanPercent':data.get('rescanPercent'),'counts':data.get('counts'),
              'stages':data.get('stages')
          },ensure_ascii=False),flush=True)
          with urllib.request.urlopen(
                urllib.request.Request(
                  'https://api-suaveforge.suaveforge.com:18458/api/g2b/pipeline-status',
                  headers={'Cache-Control':'no-cache'}),timeout=25) as response:
              current=json.load(response)
          state=current.get('scheduler') or {}
          print('RFP_LIVE_SCANNER_QUEUE_STATUS',json.dumps({
             'upgradedVersions':state.get('rfpDeployedReaderVersions'),
             'upgradeActive':state.get('rfpUpgradeActive'),
             'upgradeJob':state.get('rfpUpgrade'),
             'regularRfp':state.get('rfp')
          },ensure_ascii=False),flush=True)
          PY
