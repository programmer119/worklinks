name: WorkLinks RFP production browser polling diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/worklinks-rfp-rescan-live-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install browser
        run: |
          python3 -m pip install -q playwright
          python3 -m playwright install chromium
      - name: Diagnose actual browser requests over 35 seconds
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          from playwright.sync_api import sync_playwright
          page_url='https://worklinks.suaveforge.com/startup-support/?view=jobs'
          api_url='https://api-suaveforge.suaveforge.com:18458/api/g2b/rfp-rescan-progress'
          try:
            req=urllib.request.Request(api_url,headers={'Origin':'https://worklinks.suaveforge.com','Cache-Control':'no-cache'})
            t=time.monotonic()
            with urllib.request.urlopen(req,timeout=30) as response:
              result=json.load(response)
              print('PYTHON_API',json.dumps({'elapsed':round(time.monotonic()-t,2),'status':response.status,'cors':response.headers.get('Access-Control-Allow-Origin'),'asOf':result.get('asOf'),'done':result.get('counts',{}).get('completed')},ensure_ascii=False),flush=True)
          except Exception as e:print('PYTHON_API_ERROR',repr(e),flush=True)
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            page=browser.new_page(viewport={'width':1310,'height':820})
            def rfp(r): return '/rfp-rescan-progress' in r.url
            page.on('console',lambda msg:print('BROWSER_CONSOLE',msg.type,msg.text[:350],flush=True) if msg.type=='error' else None)
            page.on('pageerror',lambda err:print('BROWSER_PAGEERROR',str(err)[:500],flush=True))
            page.on('request',lambda req:print('REQ',req.url,flush=True) if rfp(req) else None)
            page.on('requestfailed',lambda req:print('FAILED_REQ',req.url,req.failure,flush=True) if rfp(req) else None)
            page.on('response',lambda resp:print('RESPONSE',resp.status,resp.url,'cors',resp.headers.get('access-control-allow-origin',''),flush=True) if rfp(resp) else None)
            page.goto(page_url,wait_until='domcontentloaded',timeout=60000)
            for i in range(8):
              page.wait_for_timeout(5000)
              data=page.evaluate("""() => ({
                text: document.getElementById('rfpRescanLabel')?.textContent,
                count: document.getElementById('rfpRescanCount')?.textContent,
                seconds: document.getElementById('rfpRescanSeconds')?.textContent,
                error: typeof rfpRescanProgressError==='undefined'?'unset':rfpRescanProgressError,
                successAt:typeof rfpRescanLastSuccessAt==='undefined'?null:rfpRescanLastSuccessAt,
                fetchedAt:typeof rfpRescanLastRead==='undefined'?null:rfpRescanLastRead,
                serverAt:typeof rfpRescanProgress==='undefined'?null:rfpRescanProgress?.asOf
              })""")
              print('BROWSER_STATE',i,json.dumps(data,ensure_ascii=False),flush=True)
            browser.close()
          PY
