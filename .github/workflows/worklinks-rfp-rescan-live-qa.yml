name: WorkLinks RFP production polling post-fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/worklinks-rfp-rescan-live-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Install real browser
        run: |
          python3 -m pip install -q playwright
          python3 -m playwright install chromium
      - name: Confirm 4+ successful RFP refreshes under bounded saved-data loading
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1330,'height':830})
              progress_requests=[]
              progress_success=[]
              failures=[]
              saved_requests=[]
              page.on('request',lambda q:progress_requests.append(q.url) if '/rfp-rescan-progress' in q.url else saved_requests.append(q.url) if '/saved?sw=1' in q.url else None)
              page.on('response',lambda r:progress_success.append(r.status) if '/rfp-rescan-progress' in r.url and r.status==200 else None)
              page.on('requestfailed',lambda q:failures.append({'url':q.url,'error':q.failure}) if '/rfp-rescan-progress' in q.url else None)
              for attempt in range(8):
                  page.goto('https://worklinks.suaveforge.com/startup-support/?view=jobs&qa='+str(attempt),wait_until='domcontentloaded',timeout=60000)
                  if 'const savedWindow=g2bCompactScreen()?160:400' in page.content():break
                  time.sleep(5)
              assert 'const savedWindow=g2bCompactScreen()?160:400' in page.content(),'new bounded loader not deployed'
              progress_requests.clear();progress_success.clear();failures.clear();saved_requests.clear()
              print('NEW_FRONTEND_DEPLOYED=TRUE',flush=True)
              for i in range(10):
                  page.wait_for_timeout(5000)
                  info=page.evaluate("""() => ({
                    label:document.querySelector('#rfpRescanLabel')?.textContent,
                    count:document.querySelector('#rfpRescanCount')?.textContent,
                    lastSuccess:typeof rfpRescanLastSuccessAt==='undefined'?0:rfpRescanLastSuccessAt,
                    error:typeof rfpRescanProgressError==='undefined'?'unset':rfpRescanProgressError,
                    serverAsOf:typeof rfpRescanProgress==='undefined'?'unknown':rfpRescanProgress?.asOf,
                    savedOffset:typeof g2bLoadedOffset==='undefined'?null:g2bLoadedOffset,
                    savedTotal:typeof g2bSavedTotal==='undefined'?null:g2bSavedTotal
                  })""")
                  print('ACTUAL_BROWSER',i,json.dumps(info,ensure_ascii=False),flush=True)
              print('RESULT',json.dumps({'progressRequests':len(progress_requests),'successfulResponses':len(progress_success),'failedProgressRequests':failures,'savedRequests':len(saved_requests)},ensure_ascii=False),flush=True)
              assert len(progress_success)>=4, 'progress refresh did not succeed at least four times'
              assert not failures,'browser rejected progress request during polling'
              assert len(saved_requests)<=5,'too many bulk saved-data requests during first load'
              assert not page.evaluate("() => Boolean(rfpRescanProgressError)"), 'live progress is marked delayed'
              browser.close()
          print('WORKLINKS_PRODUCTION_POLLING_STABLE=PASS',flush=True)
          PY
