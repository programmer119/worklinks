name: WorkLinks live onsite staffing badge verification
on:
  push:
    branches: [main]
    paths:
      - startup-support/index.html
      - startup-support/staffing-source-verified.json
      - .github/workflows/worklinks-onsite-live-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify public deployed UI and source-backed North recommendation
        shell: bash
        run: |
          set -Eeuo pipefail
          base='https://worklinks.suaveforge.com/startup-support'
          for i in $(seq 1 36); do
            curl -fsSL --connect-timeout 6 --max-time 25 \
              -H 'Cache-Control: no-cache' \
              "$base/index.html?onsite_smoke=$GITHUB_RUN_ID-$i" -o /tmp/live-worklinks.html || true
            curl -fsSL --connect-timeout 6 --max-time 25 \
              -H 'Cache-Control: no-cache' \
              "$base/staffing-source-verified.json?onsite_smoke=$GITHUB_RUN_ID-$i" -o /tmp/live-staffing.json || true
            if python3 - <<'PY'
          import json,pathlib
          html=pathlib.Path('/tmp/live-worklinks.html')
          facts=pathlib.Path('/tmp/live-staffing.json')
          assert html.is_file() and facts.is_file()
          page=html.read_text(encoding='utf-8')
          data=json.loads(facts.read_text(encoding='utf-8'))
          assert "site={key:'onsite_recommended'" in page
          assert "job-req-onsite-person" in page
          assert "상주인력 · 월평균" in page
          assert "투입기간 " in page
          north=data['byNotice']['R26BK01783957:000']
          assert north['sha256']=='0bac97cb72b9f30cdeb2e00cd6dbab748c2faf00d2d8da5eb78fc9a97e64b645'
          assert any(f.get('kind')=='headcount_recommended' and
                     f.get('count')==8 and f.get('mandatory') is False and
                     f.get('onsite') is True and '월평균 8명 이상' in f.get('sourceText','')
                     for f in north['staffingFacts'])
          print('LIVE_WORKLINKS_ONSITE_HTML=PASS')
          print('LIVE_WORKLINKS_NORTH_8_RECOMMENDATION=PASS')
          PY
            then
              echo LIVE_WORKLINKS_ONSITE_RELEASE=PASS
              exit 0
            fi
            echo "LIVE_WORKLINKS_ONSITE_RETRY=$i"
            sleep 10
          done
          echo LIVE_WORKLINKS_ONSITE_RELEASE=FAIL
          exit 1
      - name: Browser-check real deployed onsite badge clicks and tooltip content
        shell: bash
        run: |
          python3 -m pip install -q playwright
          python3 -m playwright install chromium
          python3 - <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1440,'height':900})
              errors=[]
              page.on('pageerror',lambda err: errors.append(str(err)[:180]))
              page.goto('https://worklinks.suaveforge.com/startup-support/?view=changcom',
                        wait_until='domcontentloaded',timeout=60000)
              page.wait_for_function("typeof jobRequirementBadges==='function'",timeout=45000)
              page.wait_for_function("""() => {
                const item=rfpSnapshotByNotice.get('R26BK01783957:000');
                return item?.staffingFacts?.some(x=>x.kind==='headcount_recommended'&&x.count===8);
              }""",timeout=45000)
              page.evaluate("""() => {
                document.querySelector('.workspace-tab[data-view="jobs"]')?.click();
              }""")
              output=page.evaluate("""() => {
                const root=document.getElementById('jobCards');
                if(!root)throw new Error('Job cards root missing');
                const rows=[
                  ['yongin','R26BK01807134'],
                  ['north','R26BK01783957'],
                  ['seoul','R26BK01810885']
                ];
                return rows.map(([name,bidNo])=>{
                  const x={bidNo,order:'000'};
                  const evidence=jobRequirementEvidence(x);
                  const wrap=document.createElement('div');
                  wrap.innerHTML=jobRequirementBadges(x);
                  root.append(wrap);
                  const badge=wrap.querySelector('[data-requirement="onsite"]');
                  const button=badge?.querySelector('button');
                  const tip=badge?.querySelector('.job-req-tip');
                  if(!button||!tip)throw new Error(name+' onsite UI missing');
                  button.click();
                  const result={name,bidNo,siteKey:evidence.onsite.status.key,
                    badge:button.textContent.trim(),
                    tooltip:tip.textContent.replace(/\\s+/g,' ').trim(),
                    expanded:button.getAttribute('aria-expanded'),
                    display:getComputedStyle(tip).display,
                    width:Math.round(tip.getBoundingClientRect().width)};
                  wrap.remove();
                  return result;
                });
              }""")
              print('LIVE_ONSITE_BROWSER_REPORT',json.dumps(output,ensure_ascii=False))
              print('LIVE_ONSITE_BROWSER_PAGE_ERRORS',json.dumps(errors[:5],ensure_ascii=False))
              for row in output:
                  assert row['expanded']=='true' and row['display']=='block' and row['width']>0,row
                  if row['name']=='yongin':
                      assert row['badge']=='상주 확인',row
                      for term in ['응용SW 개발자','1명','11.04개월','75%','공내역서.xlsx']:
                          assert term in row['tooltip'],(row,term)
                  elif row['name']=='north':
                      assert row['badge']=='상주 8명 이상 권고',row
                      for term in ['월평균','8명 이상','필수 인원 아님','제안요청서']:
                          assert term in row['tooltip'],(row,term)
                  elif row['name']=='seoul':
                      assert row['badge']=='상주 확인',row
                      for term in ['상주인력 근무·휴가 조건','2. 제안요청서.hwpx']:
                          assert term in row['tooltip'],(row,term)
              browser.close()
              print('LIVE_WORKLINKS_ONSITE_BROWSER_TOOLTIP=PASS')
          PY
