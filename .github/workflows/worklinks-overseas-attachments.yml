name: WorkLinks overseas attachments
on:
  workflow_run:
    workflows: ["WorkLinks overseas collection"]
    types: [completed]
  push:
    branches: [main, work/overseas-attachments-20261125]
    paths:
      - scripts/collect_overseas_attachments.py
      - tests/test_overseas_attachments.py
      - .github/workflows/worklinks-overseas-attachments.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: worklinks-overseas-attachments-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documents:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: overseas-data
          path: source-data
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: overseas-doc-data
          path: doc-data
          persist-credentials: false
      - name: Install reader and verify local fixtures
        run: |
          python -m pip install 'pypdf==5.9.0'
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-eng
          python -m py_compile scripts/collect_overseas_attachments.py
          python -c 'from pathlib import Path; s=Path("overseas/index.html").read_text(); Path("/tmp/overseas-attachment-ui.js").write_text(s.split("<script>",1)[1].split("</script>",1)[0])'
          node --check /tmp/overseas-attachment-ui.js
          python -m unittest discover -s tests -p test_overseas_attachments.py
      - name: Restore verified document cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/overseas-documents
          key: overseas-documents-v1-${{ github.run_id }}
          restore-keys: overseas-documents-v1-
      - name: Inspect public document links and extract text
        run: |
          limit=80
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then limit=5; fi
          python scripts/collect_overseas_attachments.py --notices source-data/overseas/notices.json --output doc-data/overseas/documents.json --cache "$RUNNER_TEMP/overseas-documents" --limit "$limit"
      - name: Publish only public source links and evidence metadata
        if: github.ref == 'refs/heads/main'
        working-directory: doc-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name worklinks-overseas
          git config user.email worklinks-overseas@users.noreply.github.com
          git add overseas/documents.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public overseas attachment index"
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:overseas-doc-data
          fi
