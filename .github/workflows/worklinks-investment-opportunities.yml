name: WorkLinks investment opportunities
on:
  push:
    branches:
      - main
      - feature/investment-monitor-20261015
    paths:
      - '.github/workflows/worklinks-investment-opportunities.yml'
      - 'scripts/refresh_worklinks_investment.py'
      - 'scripts/worklinks_dynamic_sources.py'
      - 'scripts/worklinks_sefund.py'
      - 'scripts/worklinks_kised.py'
      - 'scripts/worklinks_health_sources.py'
      - 'scripts/worklinks_priority_health.py'
      - 'tests/test_worklinks_priority_health.py'
      - 'tests/test_worklinks_health_sources.py'
      - 'tests/test_kised.py'
      - 'scripts/worklinks_global_accelerators.py'
      - 'tests/test_global_accelerators.py'
      - 'tests/test_investment_monitor.py'
      - 'tests/test_dynamic_sources.py'
      - 'tests/test_sefund.py'
      - 'startup-support/investment.html'
      - 'startup-support/index.html'
      - 'startup-support/kimse-intake.js'
      - 'tests/test_worklinks_kimse_intake.cjs'
      - 'tests/test_worklinks_support_sort.cjs'
  schedule:
    - cron: '25 0,12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: worklinks-investment-opportunities
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public HTML dependencies
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Install Chromium for public dynamic listings
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Validate KIMSE source intake and D-DAY regressions
        run: |
          node --test tests/test_worklinks_kimse_intake.cjs
          node --test tests/test_worklinks_support_sort.cjs
      - name: Backtest all critical healthcare institution collectors
        run: python -m unittest discover -s tests -p 'test_worklinks_priority_health.py' -v
      - name: Validate healthcare source parser with offline fixtures
        run: python -m unittest discover -s tests -p 'test_worklinks_health_sources.py' -v
      - name: Test dynamic source extraction
        run: python -m unittest discover -s tests -p 'test_dynamic_sources.py' -v
      - name: Test parsing and cautious eligibility
        run: python -m unittest discover -s tests -p 'test_investment_monitor.py' -v
      - name: Test international accelerator parsing
        run: python -m unittest discover -s tests -p 'test_global_accelerators.py' -v
      - name: Test KIS ED official notice parsing
        run: python -m unittest discover -s tests -p 'test_kised.py' -v
      - name: Read investment and BAND Foundation notices
        id: collect
        continue-on-error: true
        run: python scripts/refresh_worklinks_investment.py
      - name: Commit only investment snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          snapshot="$(mktemp)"
          cp startup-support/investment-opportunities.json "$snapshot"
          for attempt in 1 2 3; do
            # Rebase the generated data on the latest default branch; never force push.
            git fetch origin main
            git reset --hard origin/main
            cp "$snapshot" startup-support/investment-opportunities.json
            git add startup-support/investment-opportunities.json
            if git diff --cached --quiet; then
              echo 'Investment snapshot already current'
              exit 0
            fi
            git commit -m 'data: refresh investment opportunity snapshot'
            if git push origin HEAD:main; then
              echo 'Investment snapshot committed'
              exit 0
            fi
            echo "Remote changed during snapshot push; retry $attempt/3"
            sleep 2
          done
          echo 'Failed to commit investment snapshot after retries' >&2
          exit 1
      - name: Mark failed if all sources failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
      - name: Fail visibly on critical KIMSE listing gaps or stale evidence
        if: always()
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import sys
          from pathlib import Path

          path=Path("startup-support/investment-opportunities.json")
          if not path.is_file():
              print("::error title=KIMSE coverage missing::No investment snapshot")
              sys.exit(1)
          snapshot=json.loads(path.read_text(encoding="utf-8"))
          stamp=snapshot.get("generatedAt")
          try:
              generated=dt.datetime.fromisoformat(stamp)
              if generated.tzinfo is None: raise ValueError("timezone missing")
              age=(dt.datetime.now(dt.timezone.utc)-generated).total_seconds()
              if not 0 <= age <= 2400: raise ValueError("snapshot is stale or future-dated")
          except (TypeError, ValueError) as exc:
              print(f"::error title=KIMSE evidence stale::{exc}")
              sys.exit(1)
          coverage=snapshot.get("priorityCoverage") or {}
          missed=coverage.get("listingDegraded") or []
          expected=coverage.get("expected",0)
          healthy=coverage.get("listingHealthy",-1)
          if missed or not expected or healthy != expected:
              print("::error title=KIMSE official listing coverage incomplete::"+
                    ", ".join(missed or ["source counts missing"]))
              sys.exit(1)
          uncertain=coverage.get("applicationDatesUnverified",0)
          if uncertain:
              print(f"::warning title=KIMSE deadlines require verification::{uncertain} candidates")
          uninspected=coverage.get("uninspectedCandidates",0)
          unscanned=coverage.get("pagesPending",0)
          if uninspected or unscanned:
              print(f"::warning title=KIMSE pagination/detail review incomplete::{uninspected} uninspected article candidates, {unscanned} outstanding listing pages")
          failures=coverage.get("detailFailures",0)
          if failures:
              print(f"::warning title=KIMSE detail access failures::{failures} failures require reinspection")
          print(f"Official KIMSE listing reachability: {healthy}/{expected}. This is NOT full application/eligibility coverage.")
          PY
