name: WorkLinks overseas collection
on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_overseas.py'
      - 'scripts/overseas_ted_bulk.py'
      - 'tests/test_overseas.py'
      - '.github/workflows/worklinks-overseas.yml'
      - 'overseas/index.html'
      - 'overseas/stages.js'
      - 'tests/test_overseas_stages.cjs'
  schedule:
    - cron: '23 2,8,14,20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: worklinks-overseas-only
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: overseas-data
          path: overseas-data-checkout
      - name: Collect public procurement, isolated DB and snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/collect_overseas.py scripts/overseas_ted_bulk.py
          python3 -c 'from pathlib import Path; s=Path("overseas/index.html").read_text(); Path("/tmp/worklinks-overseas.js").write_text(s.split("<script>",1)[1].split("</script>",1)[0])'
          node --check /tmp/worklinks-overseas.js
          node tests/test_overseas_stages.cjs
          python3 -m unittest discover -s tests -p test_overseas.py
          cat > "$RUNNER_TEMP/overseas-publish.sh" <<'SH'
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/overseas-data-checkout"
          git config user.name worklinks-overseas
          git config user.email worklinks-overseas@users.noreply.github.com
          git add overseas/notices.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh overseas procurement source snapshot"
            git push origin HEAD:overseas-data
          fi
          SH
          sources="uk,eu,ca"
          if [[ "${{ github.event_name }}" == "push" ]] && git log -1 --format=%B | grep -Fq "[eu-only]"; then sources="eu"; fi
          result=0
          python3 scripts/collect_overseas.py --db "$RUNNER_TEMP/overseas.sqlite" --output overseas-data-checkout/overseas/notices.json --seed overseas-data-checkout/overseas/notices.json --publish-script "$RUNNER_TEMP/overseas-publish.sh" --days 7 --sources "$sources" || result=$?
          test -s overseas-data-checkout/overseas/notices.json
          python3 - <<'PY'
          import json
          d=json.load(open('overseas-data-checkout/overseas/notices.json'))
          assert set(d['sources']) == {'uk','eu','ca'}
          assert all(r['source'] in d['sources'] and r['title'] and r['id'] for r in d['notices'])
          for key,s in d['sources'].items():
              print(key, sum(r['source']==key for r in d['notices']), 'OK' if not s['error'] else 'FAILED', s['error'] or '')
          PY
          echo "$result" > "$RUNNER_TEMP/overseas-status"
      - name: Publish overseas-only public snapshot, no domestic changes
        working-directory: overseas-data-checkout
        run: |
          git config user.name worklinks-overseas
          git config user.email worklinks-overseas@users.noreply.github.com
          git add overseas/notices.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh overseas procurement snapshot"
            git push origin HEAD:overseas-data
          fi
      - name: Fail honestly if any upstream failed
        run: test "$(cat "$RUNNER_TEMP/overseas-status")" = 0
