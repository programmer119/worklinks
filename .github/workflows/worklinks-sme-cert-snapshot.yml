name: WorkLinks official SME certificate snapshot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worklinks-sme-cert-snapshot.yml'
      - 'startup-support/index.html'
  workflow_dispatch:
  schedule:
    - cron: '24 1 * * *'
permissions:
  contents: write
concurrency:
  group: worklinks-public-sme-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check SMPP public procurement SME certificate listing for partner business numbers
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,datetime,re,html,json,pathlib,time
          page='https://smpp.go.kr/cst/smppInf/selectMiddlSslentrSchtwrListVw.do'
          source=pathlib.Path('startup-support/index.html').read_text()
          biznos=sorted(set(re.sub(r'\D','',s) for s in re.findall(r'businessNo:"([0-9-]{10,15})"',source)))
          if not biznos:raise SystemExit('PARTNER_BUSINESS_NUMBERS_MISSING')
          def lookup(bizno):
              data=urllib.parse.urlencode({'searchBsnmNo':bizno,'pageIndex':'1','menuId':'1050506','vCheck':'Y'}).encode()
              request=urllib.request.Request(page,data=data,headers={
                  'User-Agent':'Mozilla/5.0 (compatible; WorkLinks-SME-Validation/1.0)',
                  'Content-Type':'application/x-www-form-urlencoded','Referer':page})
              with urllib.request.urlopen(request,timeout=35) as response:
                  if response.status!=200:raise RuntimeError('SMPP_HTTP_'+str(response.status))
                  body=response.read().decode('utf-8')
              start=body.find('<div class="board list pc_tbl">')
              if start<0:raise RuntimeError('SMPP_DESKTOP_RESULTS_MISSING')
              table=body[start:body.find('</table>',start)]
              tb=re.search(r'<tbody[^>]*>(.*?)</tbody>',table,re.S|re.I)
              if not tb:raise RuntimeError('SMPP_TABLE_BODY_MISSING')
              found=[]
              for row in re.findall(r'<tr[^>]*>(.*?)</tr>',tb.group(1),re.S|re.I):
                  cells=[' '.join(html.unescape(re.sub(r'<[^>]*>',' ',c)).split())
                      for c in re.findall(r'<td[^>]*>(.*?)</td>',row,re.S|re.I)]
                  if len(cells)>=5 and cells[3]:
                      found.append({'company':cells[3],'agency':cells[1],'issuedAt':cells[2],
                          'size':cells[4]})
              if len(found)>1:raise RuntimeError('SMPP_AMBIGUOUS_RESULTS_'+bizno)
              record=found[0] if found else None
              if record and (record['agency']!='중소벤처기업부' or
                             record['size'] not in ['중기업','소기업','소상공인'] or
                             not re.fullmatch(r'\d{4}-\d{2}-\d{2}',record['issuedAt'])):
                  raise RuntimeError('SMPP_UNRECOGNIZED_RECORD_'+bizno)
              if record:record['validState']='valid'
              return record
          records={}
          for bizno in biznos:
              records[bizno]=lookup(bizno)
              print('OFFICIAL_SME_LOOKUP',bizno,json.dumps(records[bizno],ensure_ascii=False))
              time.sleep(0.2)
          report={'ok':True,'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'sourceUrl':page,'scope':'공공입찰용 중소기업확인서 공개 조회',
              'validity':'SMPP 유효여부=Y 필터로 현재 유효인증 목록 검색. 정확한 종료일은 공개 목록에 없음',
              'recordsByBizno':records}
          dest=pathlib.Path('startup-support/sme-cert-snapshot.json')
          dest.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('SMPP_PUBLIC_LOOKUP=PASS','PARTNERS',len(records))
          PY
      - name: Publish dated SME lookup evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp startup-support/sme-cert-snapshot.json /tmp/worklinks-sme-new.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import json,pathlib
          dest=pathlib.Path('startup-support/sme-cert-snapshot.json')
          incoming=json.loads(pathlib.Path('/tmp/worklinks-sme-new.json').read_text())
          current=json.loads(dest.read_text()) if dest.exists() else {}
          # Concurrent jobs must never replace fresher official status with a
          # snapshot checked before the currently published version.
          if str(current.get('checkedAt') or '')>str(incoming.get('checkedAt') or ''):
              print('SMPP_NEWER_RECORD_ALREADY_PUBLISHED')
          else:
              dest.write_text(json.dumps(incoming,ensure_ascii=False,indent=2)+'\n')
          PY
            git add startup-support/sme-cert-snapshot.json
            if git diff --cached --quiet; then echo SME_SNAPSHOT_UP_TO_DATE; exit 0; fi
            git commit -m 'data: update official SMPP partner SME lookup'
            if git push origin HEAD:main; then echo SME_SNAPSHOT_PUBLISHED; exit 0; fi
            echo SME_SNAPSHOT_PUSH_RETRY_$attempt
            sleep 2
          done
          echo SME_SNAPSHOT_PUBLISH_RETRIES_EXHAUSTED
          exit 1
