name: WorkLinks G2B API source gate (server123 org deploy)
on:
  push:
    branches: [main]
    paths:
      - 'server/g2b-proxy.py'
      - 'server/deploy-g2b-api-only.sh'
      - 'tests/test_worklinks_deploy_runner_policy.py'
      - '.github/workflows/worklinks-g2b-api-deploy.yml'
  workflow_dispatch:

# Personal repos cannot dispatch the SuaveForge organization's 01/02/03 runners.
# Actual deploy is isolated in suaveforge/monitor's worklinks-g2b-api-org-deploy.yml.
# That workflow checks upstream programmer119/worklinks/main every 30 minutes
# and can also be triggered manually for immediate safe server123 deployment.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate WorkLinks G2B source and deployment guard
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile server/g2b-proxy.py
          python3 tests/test_worklinks_deploy_runner_policy.py
          python3 tests/test_bid_evidence.py
          python3 tests/test_contract_evidence.py
          node tests/worklinks-jobs-regression.cjs
          echo 'WORKLINKS_G2B_SOURCE_GATE=PASS'
          echo 'SERVER123_API_DEPLOY_CONTROLLER=suaveforge/monitor'
  retire_stalled_personal_run:
    # One-time migration: cancel the old queued personal-repository runner job,
    # which could never be assigned to an organization-only runner.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel old misrouted WorkLinks API workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          run_id=39005363452
          root='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'Accept':'application/vnd.github+json',
                   'X-GitHub-Api-Version':'2022-11-28'}
          with urllib.request.urlopen(urllib.request.Request(
                  root+'/actions/runs/'+str(run_id),headers=headers),timeout=15) as f:
              item=json.load(f)
          if item.get('head_sha')!='dd3afbae7a891793a766a1c5e13d7df6d1b50e76':
              raise SystemExit('LEGACY_RUN_SHA_NOT_EXPECTED')
          if item.get('status') in ('pending','queued','waiting','requested'):
              request=urllib.request.Request(
                  root+'/actions/runs/'+str(run_id)+'/cancel',
                  headers=headers,data=b'',method='POST')
              with urllib.request.urlopen(request,timeout=15) as f:
                  assert f.status==202
              print('OBSOLETE_PERSONAL_DEPLOY_CANCEL=PASS')
          else:
              print('OBSOLETE_PERSONAL_DEPLOY_ALREADY_FINISHED',item.get('status'))
          PY
