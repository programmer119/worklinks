name: WorkLinks G2B API source gate (server123 org deploy)
on:
  push:
    branches: [main]
    paths:
      - 'server/g2b-proxy.py'
      - 'server/deploy-g2b-api-only.sh'
      - 'tests/test_worklinks_deploy_runner_policy.py'
      - '.github/workflows/worklinks-g2b-api-deploy.yml'
  workflow_dispatch:

# Personal repos cannot dispatch the SuaveForge organization's 01/02/03 runners.
# Actual deploy is isolated in suaveforge/monitor's worklinks-g2b-api-org-deploy.yml.
# That workflow checks upstream programmer119/worklinks/main every 30 minutes
# and can also be triggered manually for immediate safe server123 deployment.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate WorkLinks G2B source and deployment guard
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile server/g2b-proxy.py
          python3 tests/test_worklinks_deploy_runner_policy.py
          python3 tests/test_bid_evidence.py
          python3 tests/test_contract_evidence.py
          node tests/worklinks-jobs-regression.cjs
          echo 'WORKLINKS_G2B_SOURCE_GATE=PASS'
          echo 'SERVER123_API_DEPLOY_CONTROLLER=suaveforge/monitor'
