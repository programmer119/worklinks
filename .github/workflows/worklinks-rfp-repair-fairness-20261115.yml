name: WorkLinks RFP verified-original OCR fairness
on:
  push:
    branches: [fix/rfp-repair-fairness-20261115, main]
    paths:
      - server/worklinks-server123-pipeline.py
      - scripts/repair_open_rfp_cached_attachments.py
      - scripts/refresh_worklinks_rfp.py
      - tests/test_worklinks_server123_pipeline.py
      - tests/test_open_cached_rfp_repair.py
      - tests/test_rfp_original_format_and_short_text_20261115.py
      - server/Dockerfile.worklinks-pipeline
      - .github/workflows/worklinks-rfp-repair-fairness-20261115.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify scanner fairness and original handoff
        run: |
          python3 -m py_compile server/worklinks-server123-pipeline.py scripts/repair_open_rfp_cached_attachments.py scripts/refresh_worklinks_rfp.py
          python3 -m pip install --quiet xlrd==2.0.2 xlwt==1.3.0
          python3 tests/test_rfp_original_format_and_short_text_20261115.py
          python3 tests/test_worklinks_server123_pipeline.py
          python3 tests/test_open_cached_rfp_repair.py
          python3 tests/test_rfp_verified_file_handoff.py
          python3 tests/test_rfp_magic.py
          echo RFP_OCR_NO_STARVATION_REGRESSION=PASS
