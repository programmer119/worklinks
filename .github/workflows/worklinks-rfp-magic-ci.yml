name: WorkLinks G2B misnamed attachment regression
on:
  push:
    branches: [main]
    paths:
      - scripts/refresh_worklinks_rfp.py
      - tests/test_rfp_magic.py
      - scripts/repair_open_rfp_cached_attachments.py
      - tests/test_open_cached_rfp_repair.py
      - tests/test_rfp_pdf_ocr_and_missing_ref.py
      - server/Dockerfile.worklinks-pipeline
      - .github/workflows/worklinks-rfp-magic-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate actual magic signature routing without upstream calls
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install -q pypdf
          python3 -m py_compile scripts/refresh_worklinks_rfp.py
          python3 tests/test_rfp_magic.py
          python3 tests/test_rfp_failures.py
          python3 -m py_compile scripts/repair_yongin_signature_files_once.py
          python3 tests/test_yongin_repair.py
          python3 -m py_compile scripts/repair_open_rfp_cached_attachments.py
          python3 tests/test_open_cached_rfp_repair.py
          python3 tests/test_rfp_pdf_ocr_and_missing_ref.py
