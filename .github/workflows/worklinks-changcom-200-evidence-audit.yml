name: WorkLinks exact Changcom 200 official excerpt audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worklinks-changcom-200-evidence-audit.yml'
      - 'scripts/build_changcom_200_source_audit.py'
      - 'startup-support/rfp-coverage-index.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: worklinks-changcom-original-200-official-evidence
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build exact original-200 audit and publish
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/build_changcom_200_source_audit.py
            git add startup-support/audits/changcom-200-official-evidence-20261111.csv startup-support/audits/changcom-200-official-evidence-20261111.md
            if git diff --cached --quiet; then
              echo 'CHANGCOM_200_SOURCE_EVIDENCE_ALREADY_UP_TO_DATE=PASS'
              exit 0
            fi
            git commit -m 'audit(changcom): publish 200 official qualification excerpts and physical blockers'
            if git push origin HEAD:main; then
              echo 'CHANGCOM_200_SOURCE_EVIDENCE_PUBLISHED=PASS'
              exit 0
            fi
            echo "CHANGCOM_200_RETRY=$attempt"
          done
          exit 1
