name: WorkLinks critical KIMSE live source audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/worklinks_health_live_audit.py'
      - 'scripts/worklinks_priority_health.py'
      - '.github/workflows/worklinks-critical-health-live.yml'
  schedule:
    - cron: '10 0,12 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: critical-health-live-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Diagnose K-DATA TLS issuer chain (certificate verification required)
        continue-on-error: true
        run: |
          timeout 15s bash -c 'echo | openssl s_client -connect www.kdata.or.kr:443 -servername www.kdata.or.kr -showcerts 2>&1 | grep -E "depth=|verify error|Certificate chain|^[[:space:]]*[0-9]+ s:|^[[:space:]]*i:|Verify return code" | head -n 22'
          timeout 15s bash -c 'echo | openssl s_client -connect www.kdata.or.kr:443 -servername www.kdata.or.kr 2>/dev/null | openssl x509 -noout -issuer -ext authorityInfoAccess'
      - name: Diagnose official KHIS tender RSS fallback
        continue-on-error: true
        run: |
          python - <<'PY'
          import requests
          import xml.etree.ElementTree as ET
          url='https://www.khis.kr/rss/board.es?bid=0009&mid=a10304000000'
          try:
              response=requests.get(url,timeout=(5,12))
              print('KHIS RSS response:',response.status_code,len(response.content),
                    response.headers.get('Content-Type',''))
              response.raise_for_status()
              root=ET.fromstring(response.content)
              for item in root.findall('.//item')[:5]:
                  print('RSS notice:',(item.findtext('title') or '')[:110],
                        (item.findtext('link') or '')[:180])
          except Exception as exc:
              print('KHIS RSS probe failed:',type(exc).__name__,str(exc)[:280])
          PY
      - name: Probe actual official healthcare notice list links and report failures
        run: python scripts/worklinks_health_live_audit.py
