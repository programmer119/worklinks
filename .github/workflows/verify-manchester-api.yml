name: Manchester official notice API verification
on:
  push:
    branches: [work/overseas-attachments-20261125]
    paths: [.github/workflows/verify-manchester-api.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query exact official notice
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, json
          url='https://www.find-tender.service.gov.uk/api/1.0/ocdsReleasePackages/108918-2026'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'WorkLinks/1.0','Accept':'application/json'}),timeout=30) as response:
              print('HTTP',response.status)
              data=json.load(response)
          for r in data.get('releases',[]):
              print('NOTICE',r.get('id'),r.get('ocid'))
              for group in ('tender','planning'):
                  d=r.get(group) or {}
                  print(group, json.dumps(d,ensure_ascii=False))
          PY
