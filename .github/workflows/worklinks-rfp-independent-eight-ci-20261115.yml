name: WorkLinks independent eight downloader slots and scan manifest regression
on:
  push:
    branches: [fix/rfp-independent-8workers-and-scan-20261115]
    paths:
      - 'scripts/rfp_download_worker.py'
      - 'scripts/refresh_worklinks_rfp.py'
      - 'tests/test_rfp_independent_workers_and_scan.py'
      - '.github/workflows/worklinks-rfp-independent-eight-ci-20261115.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Test independent eight slots, scan metadata and existing dual queue
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/rfp_download_worker.py scripts/refresh_worklinks_rfp.py
          python3 tests/test_rfp_independent_workers_and_scan.py
          python3 tests/test_rfp_download_worker.py
          python3 tests/test_rfp_dual_queue.py
          python3 tests/test_rfp_bulk_manifests.py
          python3 tests/test_rfp_quota_resume.py
          python3 tests/test_worklinks_server123_pipeline.py
          echo RFP_INDEPENDENT_DOWNLOAD_AND_SCAN_CI=PASS
