name: WorkLinks G2B public API diagnostics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worklinks-g2b-public-diagnostics.yml'
      - 'server/g2b-proxy.py'
      - 'startup-support/index.html'
      - 'tests/test_direct_production.py'
      - 'tests/worklinks-jobs-regression.cjs'
      - 'startup-support/direct-production-snapshot.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Validate API Python, real SQLite join and frontend partner regression
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile server/g2b-proxy.py
          python3 tests/test_g2b_eligibility_join.py
          python3 tests/test_direct_production.py
          node tests/worklinks-jobs-regression.cjs
          node tests/worklinks-live-partner-smoke.cjs
      - name: Verify public GitHub Pages content matches current main
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,pathlib,urllib.request
          url='https://worklinks.suaveforge.com/startup-support/index.html?cachebust=ci-main'
          expected=pathlib.Path('startup-support/index.html').read_bytes()
          try:
            req=urllib.request.Request(url,headers={'User-Agent':'WorkLinks-Deploy-Verification/1.0','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=22) as f: actual=f.read()
            print('LIVE_HTML_SHA256',hashlib.sha256(actual).hexdigest())
            print('GIT_HTML_SHA256',hashlib.sha256(expected).hexdigest())
            print('LIVE_FRONTEND_MATCHES_MAIN',actual==expected)
            if actual!=expected:print('LIVE_FRONTEND_NOTE=may still be propagating')
          except Exception as e:
            print('LIVE_FRONTEND_CHECK_UNAVAILABLE',type(e).__name__,str(e)[:140])
          PY
      - name: Verify published direct-production data (no private API key)
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,pathlib
          local=json.loads(pathlib.Path('startup-support/direct-production-snapshot.json').read_text())
          url='https://worklinks.suaveforge.com/startup-support/direct-production-snapshot.json'
          req=urllib.request.Request(url,headers={'User-Agent':'WorkLinks-Production-Smoke/1.0','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=25) as f:
            remote=json.load(f)
          assert remote==local,'PUBLISHED_PRODUCTION_SNAPSHOT_MISMATCH'
          rows=remote['recordsByBizno'].get('1308185973',[])
          assert any(r.get('product')=='정보시스템개발서비스' for r in rows),'MISSING_CHANGCOM_CERTIFICATE'
          print('DIRECT_PRODUCTION_LIVE_SNAPSHOT=PASS','CHANGCOM_CERTIFICATES',len(rows),'SNAPSHOT_DATE',remote['snapshotDate'])
          PY
      - name: Check public backend without exposing secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,urllib.request,urllib.error,collections,datetime
          base='https://api-suaveforge.suaveforge.com:18458/api/g2b'
          def get(path):
            try:
              req=urllib.request.Request(base+path,headers={'User-Agent':'WorkLinks-CI-Diagnostics/1.0'})
              with urllib.request.urlopen(req,timeout=26) as f:
                return json.load(f)
            except Exception as e:
              print('PUBLIC_API_ERROR',path,type(e).__name__,str(e)[:120])
              return None
          d=get('/saved?sw=1&limit=40&offset=0')
          if not d:raise SystemExit('PUBLIC_SAVED_UNAVAILABLE')
          print('PUBLIC_SAVED_COUNTS',{k:d.get(k) for k in
            ['storedTotal','candidateTotal','totalCount','eligibilityChecked','eligibilityLinked']})
          pages=[d]
          for offset in [40,140,240,340,440]:
            p=get('/saved?sw=1&limit=100&offset='+str(offset))
            if p:pages.append(p)
          rows=[v for p in pages for v in p.get('items') or []]
          bykind=collections.Counter(str(x.get('kind')) for x in rows)
          eligibility=collections.Counter(
            'no-cache' if not x.get('bidEligibility') else
            'no-req' if not x['bidEligibility'].get('requirements') else
            'has-req' for x in rows)
          print('SAMPLED_KIND_DISTRIBUTION',dict(bykind))
          print('SAMPLED_ELIGIBILITY_DISTRIBUTION',dict(eligibility))
          for row in [x for x in rows if x.get('kind')=='servc'][:12]:
            e=row.get('bidEligibility') or {}
            print('SERVICE_ELIGIBILITY',json.dumps({
              'number':row.get('bidNo'),'order':row.get('order'),
              'title':str(row.get('title') or '')[:45],
              'closes':row.get('closes'),'cached':bool(e),
              'requirementCodes':[r.get('codes') for r in (e.get('requirements') or [])],
              'totalCount':e.get('totalCount')},ensure_ascii=False))
          for term in ['DGIST 산학협력단','정보통신인프라 구축 용역','2026년 건설공사 안전관리']:
            hits=[x for x in rows if term in str(x.get('title') or '')]
            print('SCREENSHOT_DATE_MATCH',term,[{'closes':x.get('closes'),'posted':x.get('posted')} for x in hits[:2]])
          for row in rows[:10]:
            eligibility=row.get('bidEligibility') or {}
            print('SAMPLE_BID',json.dumps({
              'kind':row.get('kind'),'number':row.get('bidNo'),'order':row.get('order'),
              'posted':row.get('posted'),'closes':row.get('closes'),
              'eligibilityAttached':bool(eligibility),
              'requirementsCount':len(eligibility.get('requirements') or []),
              'licenseComplete':eligibility.get('complete')},ensure_ascii=False))
          production=get('/direct-production?bizno=1308185973')
          if production:
            print('PARTNER_PRODUCTION_SNAPSHOT',{'ok':production.get('ok'),'snapshot':production.get('snapshotDate'),'records':production.get('recordCount'),'found':production.get('found')})
          company=get('/company?bizno=1308185973')
          if company:
            print('PARTNER_REGISTRY',{
              'found':company.get('found'),'complete':company.get('complete'),
              'industryCount':company.get('industryCount'),'returnedRows':len(company.get('industries') or []),
              'unattributedResponseRows':company.get('unattributedResponseRows')})
            print('PARTNER_REGISTRY_CODES',[
              {'code':i.get('code'),'status':i.get('status'),'expiresAt':i.get('expiresAt')}
              for i in company.get('industries') or []
              if i.get('code') in ('1468','1426','1469','1470','1169','9999')])
          PY
