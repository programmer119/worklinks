name: WorkLinks Naver Cafe API deploy and smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worklinks-naver-cafe-deploy.yml'
      - 'server/naver-cafe-proxy.mjs'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, server123, research-general]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Guard dedicated research runner
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "runner=$RUNNER_NAME"
          test "$RUNNER_NAME" = "123-research-general-06"

      - name: Install WorkLinks Naver Cafe service
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s /home/worklinks/secrets/naver.env
          grep -q '^NAVER_CLIENT_ID=' /home/worklinks/secrets/naver.env
          grep -q '^NAVER_CLIENT_SECRET=' /home/worklinks/secrets/naver.env

          install -d -m 0755 /home/worklinks/app
          install -m 0644 server/naver-cafe-proxy.mjs /home/worklinks/app/naver-cafe-proxy.mjs

          NODE_BIN="$(command -v node)"
          test -x "$NODE_BIN"

          cat >/etc/systemd/system/worklinks-naver-cafe.service <<UNIT
          [Unit]
          Description=WorkLinks Naver Cafe Search Proxy
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=root
          Group=root
          WorkingDirectory=/home/worklinks/app
          Environment=PORT=18190
          ExecStart=$NODE_BIN /home/worklinks/app/naver-cafe-proxy.mjs
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          UNIT

          systemctl daemon-reload
          systemctl enable --now worklinks-naver-cafe.service
          sleep 2
          curl -fsS http://127.0.0.1:18190/health

      - name: Add narrow Caddy route
        shell: bash
        run: |
          set -Eeuo pipefail
          ADMIN=http://127.0.0.1:2019

          if curl -fsS "$ADMIN/id/worklinks_naver_cafe_scan" >/dev/null 2>&1; then
            echo "Caddy route already present"
          else
            SERVER="$(
              curl -fsS "$ADMIN/config/apps/http/servers" |
              python3 -c 'import json,sys
d=json.load(sys.stdin)
for k,v in d.items():
    s=json.dumps(v,ensure_ascii=False)
    if "api-monitor.suaveforge.com" in s:
        print(k); break
else:
    for k,v in d.items():
        if any(str(x).endswith(":443") for x in v.get("listen",[])):
            print(k); break'
            )"
            test -n "$SERVER"

            cat >/tmp/worklinks-caddy-route.json <<'JSON'
          {
            "@id": "worklinks_naver_cafe_scan",
            "match": [
              {
                "host": ["api-monitor.suaveforge.com"],
                "path": ["/worklinks/api/naver-cafe-scan"]
              }
            ],
            "handle": [
              {
                "handler": "rewrite",
                "uri": "/api/naver-cafe-scan"
              },
              {
                "handler": "reverse_proxy",
                "upstreams": [
                  {"dial": "127.0.0.1:18190"}
                ]
              }
            ],
            "terminal": true
          }
          JSON

            curl -fsS -X PUT               -H 'Content-Type: application/json'               --data-binary @/tmp/worklinks-caddy-route.json               "$ADMIN/config/apps/http/servers/$SERVER/routes/0"
          fi

          curl -fsS "$ADMIN/id/worklinks_naver_cafe_scan" >/dev/null
          echo "CADDY_ROUTE=PASS"

      - name: Run real Naver Cafe scan
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/worklinks-scan
          curl -fsS 'http://127.0.0.1:18190/api/naver-cafe-scan?force=1' > /tmp/worklinks-scan/naver-cafe-scan.json

          python3 - <<'PY'
          import json
          p='/tmp/worklinks-scan/naver-cafe-scan.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d.get('ok') is True
          assert d.get('query_count',0) > 0
          errors=[q for q in d.get('queries',[]) if q.get('error')]
          summary={
            'ok': d.get('ok'),
            'generated_at': d.get('generated_at'),
            'query_count': d.get('query_count'),
            'item_count': d.get('item_count'),
            'query_errors': errors,
            'queries': d.get('queries',[]),
            'sample_items': d.get('items',[])[:40]
          }
          open('/tmp/worklinks-scan/summary.json','w',encoding='utf-8').write(json.dumps(summary,ensure_ascii=False,indent=2))
          print(json.dumps({
            'ok':summary['ok'],
            'query_count':summary['query_count'],
            'item_count':summary['item_count'],
            'query_error_count':len(errors)
          },ensure_ascii=False))
          if errors:
              raise SystemExit('Naver API query errors found')
          PY

      - name: Verify public read-only endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS --max-time 20             'https://api-monitor.suaveforge.com/worklinks/api/naver-cafe-scan'             > /tmp/worklinks-scan/public-endpoint.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/worklinks-scan/public-endpoint.json',encoding='utf-8'))
          assert d.get('ok') is True
          assert d.get('query_count',0) > 0
          print('PUBLIC_ENDPOINT=PASS item_count='+str(d.get('item_count')))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: worklinks-naver-cafe-scan
          path: /tmp/worklinks-scan/
          retention-days: 1
